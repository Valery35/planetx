# Сообщение автору в Telegram о новом выпуске с кнопкой «Подготовить
# пост». Кнопку обрабатывает бот PlanetX (bot/planetx_bot.py), пост
# в канал уходит только после «Опубликовать» в черновике.
# Секреты хранилища - TELEGRAM_BOT_TOKEN, токен бота, и TELEGRAM_OWNER,
# номер чата автора. Без них шаг ничего не делает. Файл одинаков для
# всех модулей линейки и расширений RustGIS, имя хранилища бот берёт
# из кнопки. Расширение бот узнаёт по метке rustgis-v<версия> или по
# хранилищу <модуль>-rustgis. Файл в хранилищах не правится, правка
# идёт в образце Valery35/planetx.
# Шаг запускается, когда выпуск опубликован, сразу или из черновика.
# Черновик и неопубликованный выпуск кнопку не дают. Ручной запуск -
# Actions, «Telegram о выпуске», Run workflow, в поле метка выпуска.
name: Telegram о выпуске

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Метка выпуска как на GitHub - 0.13.5, v1.44.1, rustgis-v0.5.1
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Сообщение автору
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER: ${{ secrets.TELEGRAM_OWNER }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.event.repository.name }}
          URL: ${{ github.event.release.html_url || format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, inputs.tag) }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$OWNER" ]; then
            echo "Секреты TELEGRAM_BOT_TOKEN и TELEGRAM_OWNER не заданы"
            exit 0
          fi
          python3 - <<'EOF'
          import json, os, urllib.request
          body = {
              "chat_id": os.environ["OWNER"],
              "text": "Вышел выпуск {} {}\n{}".format(
                  os.environ["REPO"], os.environ["TAG"], os.environ["URL"]),
              "disable_web_page_preview": True,
              "reply_markup": {"inline_keyboard": [[{
                  "text": "Подготовить пост",
                  "callback_data": "draft:{}:{}".format(
                      os.environ["REPO"], os.environ["TAG"])}]]},
          }
          request = urllib.request.Request(
              "https://api.telegram.org/bot{}/sendMessage".format(
                  os.environ["TOKEN"]),
              data=json.dumps(body).encode("utf-8"),
              headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=30) as answer:
              print(json.loads(answer.read())["ok"])
          EOF
