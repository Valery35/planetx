<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title"></title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700\
&family=Golos+Text:wght@400;500;600&display=swap');

:root{
  --paper:#EEF2F6; --paper-2:#E2E8EF; --ink:#131C26; --ink-soft:#4A5866;
  --teal:#1D5FA8; --teal-deep:#12457D; --amber:#C2622C;
  --line:rgba(19,28,38,.14); --r:14px; --maxw:1080px;
  --display:'Bitter',Georgia,serif;
  --body:'Golos Text','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
section[id],[id]{scroll-margin-top:74px}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;
  letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal-deep);margin-bottom:18px;
  display:inline-flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--amber);
  display:inline-block}
.hdr{position:sticky;top:0;z-index:20;background:rgba(238,242,246,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;
  height:62px;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px;
  font-family:var(--display);font-weight:700;text-decoration:none;
  font-size:20px}
.brand span{font-family:var(--body);font-weight:500;font-size:13px;
  color:var(--ink-soft)}
.right{display:flex;align-items:center;gap:22px}
.nav{display:flex;gap:22px;font-size:15px}
.nav a{text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--teal-deep)}
@media(max-width:860px){.nav{display:none}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;font-size:13px;font-weight:600}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;
  font:inherit;color:var(--ink-soft)}
.lang button.on{background:var(--teal);color:#fff}
.hero{padding:74px 0 48px}
.hero h1{font-size:clamp(34px,5vw,56px);max-width:18ch}
.hero .lead{margin-top:22px;font-size:20px;max-width:64ch;
  color:var(--ink-soft)}
.cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:var(--r);
  text-decoration:none;font-weight:600;font-size:16px}
.btn-main{background:var(--teal);color:#fff}
.btn-main:hover{background:var(--teal-deep)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal)}
section{padding:56px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,3.3vw,38px);max-width:24ch}
section .sub{margin-top:16px;max-width:70ch;color:var(--ink-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:34px}
@media(max-width:860px){.pair,.trio{grid-template-columns:1fr}}
.card{background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 24px}
.card h3{font-size:19px;margin-bottom:10px}
.card p{color:var(--ink-soft);font-size:16px}
.card p + p{margin-top:10px}
.card.key{margin-top:24px}
.card ol{margin:10px 0;padding-left:22px;color:var(--ink-soft);font-size:16px}
.card li + li{margin-top:6px}
.card a{color:var(--teal-deep)}
figure{margin:30px 0 0}
figure img{width:100%;height:auto;display:block;border-radius:var(--r);
  border:1px solid var(--line);background:#000}
.shot{margin-top:38px}
figcaption{margin-top:10px;font-size:14px;color:var(--ink-soft)}
.tools{margin-top:34px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:#fff}
.group{background:var(--paper-2);padding:10px 20px;font-weight:600;
  font-size:14px;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.tool{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:14px 20px;
  border-bottom:1px solid var(--line)}
.tool:last-child{border-bottom:0}
.num{font-family:var(--display);font-weight:700;color:var(--teal-deep)}
.txt b{display:block;font-size:16px}
.txt span{color:var(--ink-soft);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:40px}
@media(max-width:860px){.facts{grid-template-columns:1fr}}
.fact b{display:block;font-family:var(--display);font-size:30px;
  line-height:1.1}
.fact span{color:var(--ink-soft);font-size:15px}
.ftr{padding:40px 0 60px;border-top:1px solid var(--line);
  color:var(--ink-soft);font-size:15px}
.ftr a{color:var(--teal-deep)}

.nav a.on{color:var(--teal-deep);font-weight:600}
.card.link{display:block;text-decoration:none;color:inherit}
.card.link:hover{border-color:var(--teal)}
.card.link h3{color:var(--teal-deep)}
.row{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:14px;
  padding:10px 20px;border-bottom:1px solid var(--line);font-size:15px}
.row span{color:var(--ink-soft)}
.row .src{display:block;font-style:normal;font-size:13px;margin-top:3px;
  color:var(--teal-deep)}
@media(max-width:860px){.row{grid-template-columns:1fr}}
figure.narrow{max-width:620px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;
  margin-top:34px}
.side figure{margin:0}
.side .row{grid-template-columns:1fr;gap:4px}
@media(max-width:860px){.side{grid-template-columns:1fr}}
.release{margin-top:20px}
.release .date{color:var(--ink-soft);font-size:14px;margin:2px 0 8px}
.release ul{margin:0;padding-left:20px;color:var(--ink-soft);font-size:16px}
.release li + li{margin-top:6px}
.release div p{color:var(--ink-soft);font-size:16px}
</style>

var TEXTS = {"ru": {"link.r1.h": "Связь с картой", "link.r1.p": "Глобус следует за окном карты QGIS или карта за глобусом, в любой системе координат. Выделение объектов общее.", "link.r2.h": "Подписи", "link.r2.p": "Подписи слоёв по настройкам QGIS ставятся надписями глобуса - ровно при любом повороте, без обрезки на стыках тайлов.", "link.r3.h": "Опрос щелчком", "link.r3.p": "Окно «Объекты» показывает атрибуты слоёв под щелчком вместе с метками, очагами, высотой, корой и значениями карт.", "link.r4.h": "Время слоёв", "link.r4.p": "Слой с временными свойствами QGIS показывается на промежутке шкалы времени глобуса. Точечный слой с полем времени - трек с камерой следом.", "link.r5.h": "Исторические карты", "link.r5.p": "Растру ставится год. Карты одной группы сменяют друг друга по шкале, шторка сравнивает два года. Карты Рамсея из каталога 56 тысяч листов привязываются в проект.", "link.r6.h": "Выдавливание", "link.r6.p": "Многоугольники, линии и точки слоя поднимаются по полю или постоянной высоте - кварталы, стены, столбики, цвет из стиля.", "layers.moscow": "Демо «Москва, исторические карты» - карта своего года поверх снимка, шкала ведёт по годам.", "layers.contours": "Горизонтали у Эльбруса на снимке, выгружаются в проект слоем с отметками.", "layers.eyebrow": "Слои проекта", "layers.h2": "Карта QGIS на рельефе глобуса", "layers.sub": "Отмеченные слои текущего проекта рисует сам QGIS - со стилями, порядком и прозрачностью карты, - и картинка ложится на рельеф. Векторные, растровые, WMS, XYZ, PostGIS и любые другие слои QGIS. Правка данных и стиля видна на глобусе после перерисовки, автообновление включено по умолчанию.", "relief.fig": "Демо «Бриенцское озеро». Дно по сетке swissBATHY3D 10 м, вода на уровне 564 м, путь через самое глубокое место.", "relief.r1.h": "Рельеф глобуса", "relief.r1.p": "Пункт меню растра. Растр в любой системе координат, несколько растров по порядку проекта, сцена хранит выбор.", "relief.r2.h": "Батиметрия водоёма", "relief.r2.p": "Растр глубин или отметок дна и уровень воды. Вода видна на глобусе и на профиле высот.", "relief.r3.h": "Батиметрия по промерам", "relief.r3.p": "Точки эхолота с глубиной в поле или Z - грид глубин с шагом по плотности промеров и маской дальше 10 шагов.", "relief.r4.h": "Выемка и насыпь", "relief.r4.p": "Две съёмки на одной сетке - объёмы и площади выемки и насыпи с порогом, растр разности со шкалой.", "relief.r5.h": "Горизонтали в проект", "relief.r5.p": "Горизонтали видимого участка и изолинии растра - слой GeoPackage с подписями отметок.", "relief.eyebrow": "Свой рельеф", "relief.h2": "Съёмка, батиметрия, выемка и насыпь", "relief.sub": "Растр высот проекта врезается в рельеф глобуса с плавным краем и уровнями до 17 - около 1 м на пиксель. Растр глубин водоёма даёт дно и воду на своём уровне. Профиль высот, линейка, уклон и горизонтали считают по своему рельефу.", "under.fig": "Рабочий проект у Соликамска - гриды кровель и подошв пластов В, А'Б и КрII под прозрачной землёй, изолинии на верхней кровле, стенки блока до низа модели.", "under.r1.h": "Скважины", "under.r1.p": "Устья, интервалы и инклинометрия, ствол по минимальной кривизне, цвет по коду пласта.", "under.r2.h": "Кровли и гриды", "under.r2.p": "Растр отметок - поверхность под землёй в цветах стиля QGIS, пара _top и _bottom - пласт с торцами, блок со стенками до низа модели.", "under.r3.h": "Объёмом по Z", "under.r3.p": "Линии и многоугольники с отметками Z - «3D-забор» разреза, тоннели, здания многогранниками.", "under.r4.h": "Разрезы с картинкой", "under.r4.p": "Картинка разреза на вертикальной стенке вдоль линии между отметками верха и низа.", "under.eyebrow": "Под землёй", "under.h2": "Геологическая модель из слоёв проекта", "under.sub": "Скважины, кровли пластов, гриды, тоннели и слои с отметками Z - обычные слои проекта. Флажок слоя ставит его под землю, земля над моделью становится прозрачной, многоугольник «Моих меток» вырезает блок, камера опускается под поверхность. Щелчок по стволу даёт пласт и глубину по стволу.", "model.fig": "Разрез 13 км через тот же проект - рельеф, пласты В, А'Б и КрII своими цветами, порода между ними.", "model.fig2": "Демо «Пермские отложения» - 9 кровель, 6 скважин в полосе 200 м, наклонная скважина C-04.", "model.eyebrow": "Разрез модели", "model.h2": "Геологический разрез вдоль пути", "model.sub": "Окно «Разрез модели» строит разрез по любому пути «Моих меток» из отмеченных слоёв проекта - кровель, скважин в полосе вдоль линии и объектов с Z. Цвета пластов и породы между ними задаются щелчком правой кнопки по разрезу и хранятся в проекте. Разрез сохраняется картинкой PNG и таблицей CSV по точкам пути.", "back.r1.h": "Видимое на глобусе", "back.r1.p": "Землетрясения, станции, месторождения, ЛЭП, кабели и другие слои вида - GeoPackage по рамке вида с цветом и размером.", "back.r2.h": "Кора CRUST1.0", "back.r2.p": "Кровли трёх слоёв осадков, трёх слоёв коры и Мохо - растры отметок по рамке вида.", "back.r3.h": "Метки и картинки", "back.r3.p": "Папка «Моих меток» - слоем GeoPackage, картинки на поверхности - GeoTIFF.", "back.eyebrow": "Обратно в проект", "back.h2": "Данные глобуса слоями QGIS", "title": "PlanetX - Проект QGIS · Информ++", "brand.sub": "для QGIS", "nav.main": "Главная", "nav.places": "Метки", "nav.project": "Проект QGIS", "nav.data": "Данные", "nav.imagery": "Космоснимки", "nav.news": "Что нового", "ftr.line1": "лицензия GNU GPL v3 · QGIS 3.36 и новее, QGIS 4", "ftr.line2": "Разработано ООО «Информ++»", "ftr.line3": "Космоснимки Esri, Vantor, Earthstar Geographics, and the GIS User Community. Картографические данные © участники OpenStreetMap, векторные тайлы OpenFreeMap. Рельеф Mapzen Terrain Tiles. Марс - NASA, USGS, Viking MDIM2.1, тайлы OpenPlanetaryMap, Луна - NASA, GSFC, ASU, LRO LROC WAC, USGS. Созвездия и имена звёзд - d3-celestial, © Olaf Frohn. Темы, огни и пожары - NASA GIBS, Black Marble, FIRMS. Землетрясения и плиты Slab2 - USGS, кора - CRUST1.0, палеогеография - PALEOMAP PaleoDEM.", "ftr.free": "Модуль бесплатный и открытый.", "ftr.support": "Поддержать разработку"}, "en": {"link.r1.h": "Link with the map", "link.r1.p": "The globe follows the QGIS map window or the map follows the globe, in any coordinate system. Feature selection is shared.", "link.r2.h": "Labels", "link.r2.p": "Layer labels from the QGIS settings become globe labels - upright at any turn, not cut at tile edges.", "link.r3.h": "Identify", "link.r3.p": "The Identify window shows layer attributes under the click together with places, quakes, height, crust and map values.", "link.r4.h": "Layer time", "link.r4.p": "A layer with QGIS temporal properties is shown for the interval of the globe time slider. A point layer with a time field is a track with a follow camera.", "link.r5.h": "Historical maps", "link.r5.p": "A raster gets a year. Maps of one group replace each other along the slider, a swipe compares two years. Rumsey maps from a catalogue of 56 thousand sheets are georeferenced into the project.", "link.r6.h": "Extrusion", "link.r6.p": "Polygons, lines and points of a layer are extruded by a field or a constant height - blocks, walls, columns, colour from the style.", "layers.moscow": "The Moscow historical maps demo - the map of its year over imagery, the slider steps through the years.", "layers.contours": "Contours at Elbrus over imagery, exported to the project as a layer with elevations.", "layers.eyebrow": "Project layers", "layers.h2": "The QGIS map on the globe terrain", "layers.sub": "The checked layers of the current project are drawn by QGIS itself - with the styles, order and opacity of the map - and the picture lies on the terrain. Vector, raster, WMS, XYZ, PostGIS and any other QGIS layers. Edits to the data and style show on the globe after a redraw, auto refresh is on by default.", "relief.fig": "The Lake Brienz demo. The bed from the swissBATHY3D 10 m grid, water at 564 m, a path across the deepest point.", "relief.r1.h": "Globe terrain", "relief.r1.p": "A raster menu item. A raste function apply(lang){
  var d = TEXTS[lang] || TEXTS.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n')];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll('[data-i18n-attr]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-attr')];
    if (value !== undefined) el.setAttribute('content', value);
  });
  document.querySelectorAll('[data-i18n-href]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-href')];
    if (value !== undefined) el.setAttribute('href', value);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  try { localStorage.setItem('planetx-lang', lang); } catch (e) {}
}

// Меню прокручивает кодом, а не якорем. Внутри CMS ссылка вида
// «#idea» может вести на другую страницу.
document.querySelectorAll('.nav a[href^="#"]').forEach(function(a){
  a.addEventListener('click', function(ev){
    var el = document.getElementById(a.getAttribute('href').slice(1));
    if (!el) return;
    ev.preventDefault();
    el.scrollIntoView({behavior: 'smooth', block: 'start'});
  });
});

document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){
    apply(b.getAttribute('data-lang'));
  });
});

// По умолчанию русский: страница живёт на русском сайте.
var saved = null;
try { saved = localStorage.getItem('planetx-lang'); } catch (e) {}
apply(saved || 'ru');

// Тексты подставляются после разбора страницы, переход по адресу
// с решёткой доводится до места вручную.
(function () {
  var id = (location.hash || '').slice(1);
  if (!id) return;
  var go = function () {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({block: 'start'});
  };
  go();
  setTimeout(go, 0);
  window.addEventListener('load', go);
})();
</script>
