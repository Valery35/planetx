<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title"></title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700\
&family=Golos+Text:wght@400;500;600&display=swap');

:root{
  --paper:#EEF2F6; --paper-2:#E2E8EF; --ink:#131C26; --ink-soft:#4A5866;
  --teal:#1D5FA8; --teal-deep:#12457D; --amber:#C2622C;
  --line:rgba(19,28,38,.14); --r:14px; --maxw:1080px;
  --display:'Bitter',Georgia,serif;
  --body:'Golos Text','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
section[id],[id]{scroll-margin-top:74px}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;
  letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal-deep);margin-bottom:18px;
  display:inline-flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--amber);
  display:inline-block}
.hdr{position:sticky;top:0;z-index:20;background:rgba(238,242,246,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;
  height:62px;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px;
  font-family:var(--display);font-weight:700;text-decoration:none;
  font-size:20px}
.brand span{font-family:var(--body);font-weight:500;font-size:13px;
  color:var(--ink-soft)}
.right{display:flex;align-items:center;gap:22px}
.nav{display:flex;gap:22px;font-size:15px}
.nav a{text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--teal-deep)}
@media(max-width:860px){.nav{display:none}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;font-size:13px;font-weight:600}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;
  font:inherit;color:var(--ink-soft)}
.lang button.on{background:var(--teal);color:#fff}
.hero{padding:74px 0 48px}
.hero h1{font-size:clamp(34px,5vw,56px);max-width:18ch}
.hero .lead{margin-top:22px;font-size:20px;max-width:64ch;
  color:var(--ink-soft)}
.cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:var(--r);
  text-decoration:none;font-weight:600;font-size:16px}
.btn-main{background:var(--teal);color:#fff}
.btn-main:hover{background:var(--teal-deep)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal)}
section{padding:56px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,3.3vw,38px);max-width:24ch}
section .sub{margin-top:16px;max-width:70ch;color:var(--ink-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:34px}
@media(max-width:860px){.pair,.trio{grid-template-columns:1fr}}
.card{background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 24px}
.card h3{font-size:19px;margin-bottom:10px}
.card p{color:var(--ink-soft);font-size:16px}
.card p + p{margin-top:10px}
.card.key{margin-top:24px}
.card ol{margin:10px 0;padding-left:22px;color:var(--ink-soft);font-size:16px}
.card li + li{margin-top:6px}
.card a{color:var(--teal-deep)}
figure{margin:30px 0 0}
figure img{width:100%;height:auto;display:block;border-radius:var(--r);
  border:1px solid var(--line);background:#000}
.shot{margin-top:38px}
figcaption{margin-top:10px;font-size:14px;color:var(--ink-soft)}
.tools{margin-top:34px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:#fff}
.group{background:var(--paper-2);padding:10px 20px;font-weight:600;
  font-size:14px;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.tool{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:14px 20px;
  border-bottom:1px solid var(--line)}
.tool:last-child{border-bottom:0}
.num{font-family:var(--display);font-weight:700;color:var(--teal-deep)}
.txt b{display:block;font-size:16px}
.txt span{color:var(--ink-soft);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:40px}
@media(max-width:860px){.facts{grid-template-columns:1fr}}
.fact b{display:block;font-family:var(--display);font-size:30px;
  line-height:1.1}
.fact span{color:var(--ink-soft);font-size:15px}
.ftr{padding:40px 0 60px;border-top:1px solid var(--line);
  color:var(--ink-soft);font-size:15px}
.ftr a{color:var(--teal-deep)}

.nav a.on{color:var(--teal-deep);font-weight:600}
.card.link{display:block;text-decoration:none;color:inherit}
.card.link:hover{border-color:var(--teal)}
.card.link h3{color:var(--teal-deep)}
.row{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:14px;
  padding:10px 20px;border-bottom:1px solid var(--line);font-size:15px}
.row span{color:var(--ink-soft)}
.row .src{display:block;font-style:normal;font-size:13px;margin-top:3px;
  color:var(--teal-deep)}
@media(max-width:860px){.row{grid-template-columns:1fr}}
figure.narrow{max-width:620px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;
  margin-top:34px}
.side figure{margin:0}
@media(max-width:860px){.side{grid-template-columns:1fr}}
.release{margin-top:20px}
.release .date{color:var(--ink-soft);font-size:14px;margin:2px 0 8px}
.release ul{margin:0;padding-left:20px;color:var(--ink-soft);font-size:16px}
.release li + li{margin-top:6px}
.release div p{color:var(--ink-soft);font-size:16px}
</style>

<script>
var TEXTS = {"ru": {"idea.fig": "Евразия с высоты 9000 км. Названия стран и городов, границы стран жёлтые, границы областей тонкие белые.", "idea.c1.h": "Подложка и рельеф", "idea.c1.p": "По умолчанию Esri World Imagery как пример. Её меняют OpenStreetMap, OpenTopoMap, готовые снимки и карты или любое подключение XYZ Tiles. Рельеф с отмывкой склонов, дно морей - по сетке GEBCO 2026.", "idea.c2.h": "Ровные подписи", "idea.c2.p": "Надписи остаются ровными при любом повороте и не налезают друг на друга. Язык - язык QGIS, местные названия или один из 15 языков.", "idea.c3.h": "Атмосфера и свет", "idea.c3.p": "Голубое свечение воздуха, небо у горизонта, свет солнца на дату и время, ночная сторона с огнями городов.", "idea.eyebrow": "Как устроен глобус", "idea.h2": "Своё окно, свой движок, данные из открытых источников", "idea.sub": "Глобус рисуется на OpenGL 3.3 собственным движком, а не штатным 3D-видом QGIS. Камера держит точку взгляда, расстояние, азимут и наклон. Тайлы подложки, высот и векторной основы идут через сетевые настройки и кэш QGIS. В видеокарту попадают только смещения от центра тайла и от глаза, на уровне улиц картинка не дрожит.", "project.fig": "Пермь с высоты 40 км. Магистрали, железные дороги, номера дорог и названия пунктов поверх космоснимка.", "project.eyebrow": "Слои проекта", "project.h2": "Карта проекта ложится на глобус", "project.sub": "Векторные и растровые слои проекта рисует сам QGIS с их стилями, глобус кладёт картинку на рельеф в порядке карты. Подписи слоёв становятся надписями глобуса. Растр высот проекта заменяет рельеф в своём охвате, слои с отметками Z встают объёмом, окно карты QGIS и глобус могут следовать друг за другом.", "places.fig": "Демо «Пермь». Шкала времени на 11:30-13:00, видна Эспланада, маршрут прогулки и 3D-здания.", "places.c1.h": "Время и измерения", "places.c1.p": "Момент или промежуток метки ставит её на шкалу времени. Линейка по рельефу, площадь, профиль высот, маршрут по дорогам, номер листа карты в точке.", "places.c2.h": "Туры и видео", "places.c2.p": "Тур облетает метки с подписями остановок или проигрывает запись камеры. Запись идёт в видео MP4 или кадрами PNG любого размера, режим «Во весь экран» - для показа.", "places.c3.h": "Поделиться видом", "places.c3.p": "Страница HTML с глобусом, метками и облётом открывается в браузере без QGIS.", "places.eyebrow": "Метки, туры, видео", "places.h2": "Свои метки, их время и показ", "places.sub": "Метки, пути, многоугольники и круги рисуются щелчками по глобусу и хранятся в «Моих метках». KML и KMZ открываются и сохраняются, 3D-модели Collada, glTF и OBJ ставятся на место ручками рамки. Сцена сохраняется файлом и открывается на другом компьютере.", "worlds.mars": "Марс. Вулканы Фарсиды и долины Маринер, мозаика Viking.", "worlds.moon": "Видимая сторона Луны, карта альбедо LOLA с отмывкой рельефа.", "worlds.sky": "Небо 1 октября 2026 года. Орион, Телец и Близнецы, Луна у Плеяд.", "worlds.eyebrow": "Другие тела и небо", "worlds.h2": "Марс, Луна и звёздное небо", "worlds.sub": "Значок «Тело» заменяет Землю Марсом, Луной и другими телами. Навигация, метки, туры и линейка работают на любом теле. Пункт «Небо» показывает 5080 звёзд, 88 созвездий, Солнце, Луну и планеты на выбранный момент.", "k1": "ЛКМ", "c1.h": "Захват Земли", "c1.p": "Точка под курсором следует за мышью, после отпускания Земля вращается по инерции.", "k2": "Колесо", "c2.h": "Приближение к курсору", "c2.p": "Колесо приближает к точке под курсором, точка остаётся на месте.", "k3": "СКМ", "c3.h": "Поворот и наклон", "c3.p": "Средняя кнопка или левая с Shift поворачивают и наклоняют вид, левая с Ctrl сдвигает его вдоль экрана.", "k4": "Ctrl+K", "c4.h": "Строка «Поиск»", "c4.p": "Место, координаты, слой, окно или инструмент по названию. Enter выполняет действие или перелетает к месту.", "k5": "Угол", "c5.h": "Кольцо навигации", "c5.p": "Кольцо компаса, джойстики взгляда и сдвига, ползунок высоты. Точка в середине кольца возвращает отвесный взгляд.", "cta.release": "Скачать выпуск", "cta.install": "Каталог модулей QGIS", "cta.code": "Исходный код", "cta.manual": "Руководство PDF", "cta.manual.url": "https://github.com/Valery35/planetx/releases/latest/download/PlanetX.pdf", "controls.eyebrow": "Управление", "controls.h2": "Навигация мышью и клавиатурой", "title": "PlanetX - Глобус и навигация · Информ++", "brand.sub": "для QGIS", "nav.main": "Главная", "nav.globe": "Глобус и навигация", "nav.data": "Данные", "nav.depths": "Недра и геофизика", "nav.imagery": "Космоснимки", "nav.news": "Что нового", "ftr.line1": "лицензия GNU GPL v3 · QGIS 3.36 и новее, QGIS 4", "ftr.line2": "Разработано ООО «Информ++»", "ftr.line3": "Космоснимки Esri, Vantor, Earthstar Geographics, and the GIS User Community. Картографические данные © участники OpenStreetMap, векторные тайлы OpenFreeMap. Рельеф Mapzen Terrain Tiles. Марс - NASA, USGS, Viking MDIM2.1, Луна - USGS, LRO LOLA, тайлы OpenPlanetaryMap. Созвездия и имена звёзд - d3-celestial, © Olaf Frohn. Темы, огни и пожары - NASA GIBS, Black Marble, FIRMS. Землетрясения и плиты Slab2 - USGS, кора - CRUST1.0, палеогеография - PALEOMAP PaleoDEM."}, "en": {"idea.fig": "Eurasia from 9000 km. Names of countries and cities, country borders in yellow, region borders thin and white.", "idea.c1.h": "Base map and terrain", "idea.c1.p": "Esri World Imagery by default as an example. It can be replaced with OpenStreetMap, OpenTopoMap, ready imagery and maps or any XYZ Tiles connection. Terrain with hill shading, the sea floor from the GEBCO 2026 grid.", "idea.c2.h": "Upright labels", "idea.c2.p": "Labels stay upright at any turn and do not overlap. The language follows QGIS, local names or one of 15 languages.", "idea.c3.h": "Atmosphere and light", "idea.c3.p": "The blue glow of the air, the sky at the horizon, sunlight for a date and time, the night side with city lights.", "idea.eyebrow": "How the globe works", "idea.h2": "Its own window, its own engine, data from open sources", "idea.sub": "The globe is drawn with OpenGL 3.3 by its own engine rather than the built-in QGIS 3D view. The camera holds the look-at point, distance, heading and tilt. Base map, terrain and vector tiles go through the QGIS network settings and cache. Only offsets from the tile centre and from the eye reach the graphics card, the picture does not jitter at street level.", "project.fig": "Perm from 40 km. Motorways, railways, road numbers and place names over satellite imagery.", "project.eyebrow": "Project layers", "project.h2": "The project map lies on the globe", "project.sub": "QGIS itself renders the vector and raster layers of the project with their styles, and the globe lays the picture on the terrain in the map order. Layer labels become globe labels. A project height raster replaces the terrain within its extent, layers with Z values stand in volume, the QGIS map window and the globe can follow each other.", "places.fig": "Perm demo. The time slider at 11:30-13:00 shows the Esplanade, the walk route and 3D buildings.", "places.c1.h": "Time and measuring", "places.c1.p": "A moment or interval puts a placemark on the time slider. A ruler along the terrain, area, elevation profile, a route along roads, the map sheet number at a point.", "places.c2.h": "Tours and video", "places.c2.p": "A tour flies over placemarks with stop captions or plays a recorded camera movement. It records to an MP4 video or PNG frames of any size, full screen mode is for presentations.", "places.c3.h": "Share the view", "places.c3.p": "An HTML page with the globe, placemarks and the fly-through opens in a browser without QGIS.", "places.eyebrow": "Places, tours, video", "places.h2": "Your places, their time and showing them", "places.sub": "Placemarks, paths, polygons and circles are drawn with clicks on the globe and kept in My Places. KML and KMZ files open and save, Collada, glTF and OBJ 3D models are placed with the handles of their box. A scene is saved to a file and opens on another computer.", "worlds.mars": "Mars. The Tharsis volcanoes and Valles Marineris, Viking mosaic.", "worlds.moon": "The near side of the Moon, LOLA albedo map with hill shading.", "worlds.sky": "The sky on 1 October 2026. Orion, Taurus and Gemini, the Moon at the Pleiades.", "worlds.eyebrow": "Other bodies and the sky", "worlds.h2": "Mars, the Moon and the starry sky", "worlds.sub": "The Body icon replaces the Earth with Mars, the Moon and other bodies. Navigation, places, tours and the ruler work on any body. The Sky item shows 5080 stars, 88 constellations, the Sun, the Moon and the planets at the chosen moment.", "k1": "Left", "c1.h": "Grab the Earth", "c1.p": "The point under the cursor follows the mouse, after release the Earth keeps rotating by inertia.", "k2": "Wheel", "c2.h": "Zoom to the cursor", "c2.p": "The wheel zooms to the point under the cursor, and the point stays in place.", "k3": "Middle", "c3.h": "Turn and tilt", "c3.p": "The middle button or Shift with the left button turns and tilts the view, Ctrl with the left button shifts it along the screen.", "k4": "Ctrl+K", "c4.h": "The Search line", "c4.p": "A place, coordinates, a layer, a window or a tool by name. Enter runs the action or flies to the place.", "k5": "Corner", "c5.h": "Navigation ring", "c5.p": "The compass ring, the look and move sticks, the height slider. The dot in the middle of the ring returns the straight down view.", "cta.release": "Download the release", "cta.install": "QGIS plugin catalogue", "cta.code": "Source code", "cta.manual": "Manual PDF", "cta.manual.url": "https://github.com/Valery35/planetx/releases/latest/download/PlanetX_en.pdf", "controls.eyebrow": "Controls", "controls.h2": "Mouse and keyboard navigation", "title": "PlanetX - Globe and navigation · Inform++", "brand.sub": "for QGIS", "nav.main": "Overview", "nav.globe": "Globe and navigation", "nav.data": "Data", "nav.depths": "Inside the Earth", "nav.imagery": "Satellite imagery", "nav.news": "What's new", "ftr.line1": "GNU GPL v3 · QGIS 3.36 and newer, QGIS 4", "ftr.line2": "Developed by Inform++ LLC", "ftr.line3": "Imagery Esri, Vantor, Earthstar Geographics, and the GIS User Community. Map data © OpenStreetMap contributors, vector tiles OpenFreeMap. Terrain Mapzen Terrain Tiles. Mars - NASA, USGS, Viking MDIM2.1, the Moon - USGS, LRO LOLA, tiles OpenPlanetaryMap. Constellations and star names - d3-celestial, © Olaf Frohn. Themes, lights and fires - NASA GIBS, Black Marble, FIRMS. Earthquakes and Slab2 slabs - USGS, crust - CRUST1.0, paleogeography - PALEOMAP PaleoDEM."}};
function apply(lang){
  var d = TEXTS[lang] || TEXTS.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n')];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll('[data-i18n-attr]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-attr')];
    if (value !== undefined) el.setAttribute('content', value);
  });
  document.querySelectorAll('[data-i18n-href]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-href')];
    if (value !== undefined) el.setAttribute('href', value);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  try { localStorage.setItem('planetx-lang', lang); } catch (e) {}
}

// Меню прокручивает кодом, а не якорем. Внутри CMS ссылка вида
// «#idea» может вести на другую страницу.
document.querySelectorAll('.nav a[href^="#"]').forEach(function(a){
  a.addEventListener('click', function(ev){
    var el = document.getElementById(a.getAttribute('href').slice(1));
    if (!el) return;
    ev.preventDefault();
    el.scrollIntoView({behavior: 'smooth', block: 'start'});
  });
});

document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){
    apply(b.getAttribute('data-lang'));
  });
});

// По умолчанию русский: страница живёт на русском сайте.
var saved = null;
try { saved = localStorage.getItem('planetx-lang'); } catch (e) {}
apply(saved || 'ru');

// Тексты подставляются после разбора страницы, переход по адресу
// с решёткой доводится до места вручную.
(function () {
  var id = (location.hash || '').slice(1);
  if (!id) return;
  var go = function () {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({block: 'start'});
  };
  go();
  setTimeout(go, 0);
  window.addEventListener('load', go);
})();
</script>
