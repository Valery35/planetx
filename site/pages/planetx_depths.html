<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title"></title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700\
&family=Golos+Text:wght@400;500;600&display=swap');

:root{
  --paper:#EEF2F6; --paper-2:#E2E8EF; --ink:#131C26; --ink-soft:#4A5866;
  --teal:#1D5FA8; --teal-deep:#12457D; --amber:#C2622C;
  --line:rgba(19,28,38,.14); --r:14px; --maxw:1080px;
  --display:'Bitter',Georgia,serif;
  --body:'Golos Text','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
section[id],[id]{scroll-margin-top:74px}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;
  letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal-deep);margin-bottom:18px;
  display:inline-flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--amber);
  display:inline-block}
.hdr{position:sticky;top:0;z-index:20;background:rgba(238,242,246,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;
  height:62px;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px;
  font-family:var(--display);font-weight:700;text-decoration:none;
  font-size:20px}
.brand span{font-family:var(--body);font-weight:500;font-size:13px;
  color:var(--ink-soft)}
.right{display:flex;align-items:center;gap:22px}
.nav{display:flex;gap:22px;font-size:15px}
.nav a{text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--teal-deep)}
@media(max-width:860px){.nav{display:none}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;font-size:13px;font-weight:600}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;
  font:inherit;color:var(--ink-soft)}
.lang button.on{background:var(--teal);color:#fff}
.hero{padding:74px 0 48px}
.hero h1{font-size:clamp(34px,5vw,56px);max-width:18ch}
.hero .lead{margin-top:22px;font-size:20px;max-width:64ch;
  color:var(--ink-soft)}
.cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:var(--r);
  text-decoration:none;font-weight:600;font-size:16px}
.btn-main{background:var(--teal);color:#fff}
.btn-main:hover{background:var(--teal-deep)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal)}
section{padding:56px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,3.3vw,38px);max-width:24ch}
section .sub{margin-top:16px;max-width:70ch;color:var(--ink-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:34px}
@media(max-width:860px){.pair,.trio{grid-template-columns:1fr}}
.card{background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 24px}
.card h3{font-size:19px;margin-bottom:10px}
.card p{color:var(--ink-soft);font-size:16px}
.card p + p{margin-top:10px}
.card.key{margin-top:24px}
.card ol{margin:10px 0;padding-left:22px;color:var(--ink-soft);font-size:16px}
.card li + li{margin-top:6px}
.card a{color:var(--teal-deep)}
figure{margin:30px 0 0}
figure img{width:100%;height:auto;display:block;border-radius:var(--r);
  border:1px solid var(--line);background:#000}
.shot{margin-top:38px}
figcaption{margin-top:10px;font-size:14px;color:var(--ink-soft)}
.tools{margin-top:34px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:#fff}
.group{background:var(--paper-2);padding:10px 20px;font-weight:600;
  font-size:14px;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.tool{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:14px 20px;
  border-bottom:1px solid var(--line)}
.tool:last-child{border-bottom:0}
.num{font-family:var(--display);font-weight:700;color:var(--teal-deep)}
.txt b{display:block;font-size:16px}
.txt span{color:var(--ink-soft);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:40px}
@media(max-width:860px){.facts{grid-template-columns:1fr}}
.fact b{display:block;font-family:var(--display);font-size:30px;
  line-height:1.1}
.fact span{color:var(--ink-soft);font-size:15px}
.ftr{padding:40px 0 60px;border-top:1px solid var(--line);
  color:var(--ink-soft);font-size:15px}
.ftr a{color:var(--teal-deep)}

.nav a.on{color:var(--teal-deep);font-weight:600}
.card.link{display:block;text-decoration:none;color:inherit}
.card.link:hover{border-color:var(--teal)}
.card.link h3{color:var(--teal-deep)}
.row{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:14px;
  padding:10px 20px;border-bottom:1px solid var(--line);font-size:15px}
.row span{color:var(--ink-soft)}
.row .src{display:block;font-style:normal;font-size:13px;margin-top:3px;
  color:var(--teal-deep)}
@media(max-width:860px){.row{grid-template-columns:1fr}}
figure.narrow{max-width:620px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;
  margin-top:34px}
.side figure{margin:0}
@media(max-width:860px){.side{grid-template-columns:1fr}}
.release{margin-top:20px}
.release .date{color:var(--ink-soft);font-size:14px;margin:2px 0 8px}
.release ul{margin:0;padding-left:20px;color:var(--ink-soft);font-size:16px}
.release li + li{margin-top:6px}
.release div p{color:var(--ink-soft);font-size:16px}
</style>

var TEXTS = {"ru": {"cutaway.fig": "Разрез Земли у Японского жёлоба. Оболочки PREM, кора и очаги землетрясений.", "cutaway.paleo": "Земля 100 млн лет назад по картам PaleoDEM.", "cutaway.eyebrow": "Земля вглубь", "cutaway.h2": "Разрез Земли и землетрясения", "cutaway.sub": "Строка «Разрез Земли» вынимает из шара сектор. На его гранях видны кора CRUST1.0 двух типов, мантия с томографией SEISGLOB2, ядро, погружающиеся плиты Slab2 и очаги землетрясений на своих глубинах. Путь меток режется вниз окном «Разрез». Землетрясения - за 30 суток по сводке USGS и около 74 тысяч сильных событий с 1904 года по каталогу ISC-GEM на шкале времени.", "geo.c1.h": "Магнитное поле", "geo.c1.p": "Аномалии EMAG2v3, полюса с 1590 года, линии склонения и поле в точке по моделям gufm1 и IGRF-14.", "geo.c2.h": "Сила тяжести", "geo.c2.p": "Аномалии в свободном воздухе XGM2019e, аномалии Буге с поправкой на рельеф вокруг, геоид EGM2008 «измятым глобусом».", "geo.c3.h": "Литосфера", "geo.c3.p": "Границы и скорости плит, возраст океанического дна, тепловой поток, вулканы голоцена, активные разломы GEM.", "geo.c4.h": "Геологические карты", "geo.c4.p": "Карта Macrostrat с возрастом пород и литологическая карта GLiM с 16 классами пород.", "geo.c5.h": "Месторождения", "geo.c5.p": "Около 300 тысяч точек USGS, контуры горных разработок по снимкам Sentinel-2, шахты и карьеры OSM.", "geo.c6.h": "Палеогеография", "geo.c6.p": "Карты суши и моря на 109 возрастов до 540 млн лет назад, кора CRUST1.0 поверхностями в проект QGIS.", "geophysics.eyebrow": "Геофизика и геология", "geophysics.h2": "Карты значений и пород", "geophysics.sub": "Карты недр включаются строками каталога, щелчок показывает значение или класс в точке, карта добавляется в проект QGIS.", "subsurface.eyebrow": "Подземный режим", "subsurface.h2": "Скважины, пласты и разрезы под поверхностью", "subsurface.sub": "Скважины с интервалами и инклинометрией, кровли пластов, гриды по отметкам, разрезы с картинками, тоннели и слои с отметками Z строятся из обычных слоёв проекта. Поверхность становится полупрозрачной, многоугольник «Моих меток» вырезает блок, камера опускается под землю. Окно «Разрез модели» строит геологический разрез вдоль пути. Демо «Пермские отложения» и «Тоннели Vegas Loop» показывают режим.", "title": "PlanetX - Недра и геофизика · Информ++", "brand.sub": "для QGIS", "nav.main": "Главная", "nav.globe": "Глобус и навигация", "nav.data": "Данные", "nav.depths": "Недра и геофизика", "nav.imagery": "Космоснимки", "nav.news": "Что нового", "ftr.line1": "лицензия GNU GPL v3 · QGIS 3.36 и новее, QGIS 4", "ftr.line2": "Разработано ООО «Информ++»", "ftr.line3": "Космоснимки Esri, Vantor, Earthstar Geographics, and the GIS User Community. Картографические данные © участники OpenStreetMap, векторные тайлы OpenFreeMap. Рельеф Mapzen Terrain Tiles. Марс - NASA, USGS, Viking MDIM2.1, Луна - USGS, LRO LOLA, тайлы OpenPlanetaryMap. Созвездия и имена звёзд - d3-celestial, © Olaf Frohn. Темы, огни и пожары - NASA GIBS, Black Marble, FIRMS. Землетрясения и плиты Slab2 - USGS, кора - CRUST1.0, палеогеография - PALEOMAP PaleoDEM."}, "en": {"cutaway.fig": "Earth cutaway at the Japan Trench. PREM shells, the crust and earthquake foci.", "cutaway.paleo": "The Earth 100 million years ago from the PaleoDEM maps.", "cutaway.eyebrow": "The Earth in depth", "cutaway.h2": "Earth cutaway and earthquakes", "cutaway.sub": "The Earth cutaway row removes a sector of the globe. Its faces show the CRUST1.0 crust of two types, the mantle with SEISGLOB2 tomography, the core, Slab2 subducting slabs and earthquake foci at their depths. A placemark path is cut downwards by the Section window. Earthquakes come from the USGS 30 day feed and about 74 thousand strong events since 1904 from the ISC-GEM catalogue on the time slider.", "geo.c1.h": "Magnetic field", "geo.c1.p": "EMAG2v3 anomalies, poles since 1590, declination lines and the field at a point from the gufm1 and IGRF-14 models.", "geo.c2.h": "Gravity", "geo.c2.p": "XGM2019e free-air anomalies, Bouguer anomalies with the terrain correction, the EGM2008 geoid as a crumpled globe.", "geo.c3.h": "Lithosphere", "geo.c3.p": "Plate boundaries and motion, ocean floor age, heat flow, Holocene volcanoes, GEM active faults.", "geo.c4.h": "Geological maps", "geo.c4.p": "The Macrostrat map with rock ages and the GLiM lithological map with 16 rock classes.", "geo.c5.h": "Deposits", "geo.c5.p": "About 300 thousand USGS points, mining area outlines from Sentinel-2 images, OSM mines and quarries.", "geo.c6.h": "Paleogeography", "geo.c6.p": "Land and sea maps for 109 ages back to 540 million years, the CRUST1.0 crust as surfaces into the QGIS project.", "geophysics.eyebrow": "Geophysics and geology", "geophysics.h2": "Value and rock maps", "geophysics.sub": "Inside the Earth maps are rows of the catalogue, a click shows the value or class at the point, a map goes to the QGIS project.", "subsurface.eyebrow": "Subsurface mode", "subsurface.h2": "Boreholes, beds and sections under the surface", "subsurface.sub": "Boreholes with intervals and surveys, bed tops, grids by elevation, sections with images, tunnels and layers with Z values are built from ordinary project layers. The surface becomes semi-transparent, a My Places polygon cuts a block, the camera goes underground. The Model section window builds a geological section along a path. The Permian deposits and Vegas Loop tunnels demos show the mode.", "title": "PlanetX - Inside the Earth · Inform++", "brand.sub": "for QGIS", "nav.main": "Overview", "nav.globe": "Globe and navigation", "nav.data": "Data", "nav.depths": "Inside the Earth", "nav.imagery": "Satellite imagery", "nav.news": "What's new", "ftr.line1": "GNU GPL v3 · QGIS 3.36 and newer, QGIS 4", "ftr.line2": "Developed by Inform++ LLC", "ftr.line3": "Imagery Esri, Vantor, Earthstar Geographics, and the GIS User Community. Map data © OpenStreetMap contributors, vector tiles OpenFreeMap. Terrain Mapzen Terrain Tiles. Mars - NASA, USGS, Viking MDIM2. function apply(lang){
  var d = TEXTS[lang] || TEXTS.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n')];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll('[data-i18n-attr]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-attr')];
    if (value !== undefined) el.setAttribute('content', value);
  });
  document.querySelectorAll('[data-i18n-href]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-href')];
    if (value !== undefined) el.setAttribute('href', value);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  try { localStorage.setItem('planetx-lang', lang); } catch (e) {}
}

// Меню прокручивает кодом, а не якорем. Внутри CMS ссылка вида
// «#idea» может вести на другую страницу.
document.querySelectorAll('.nav a[href^="#"]').forEach(function(a){
  a.addEventListener('click', function(ev){
    var el = document.getElementById(a.getAttribute('href').slice(1));
    if (!el) return;
    ev.preventDefault();
    el.scrollIntoView({behavior: 'smooth', block: 'start'});
  });
});

document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){
    apply(b.getAttribute('data-lang'));
  });
});

// По умолчанию русский: страница живёт на русском сайте.
var saved = null;
try { saved = localStorage.getItem('planetx-lang'); } catch (e) {}

(function () {
  var id = (location.hash || '').slice(1);
  if (!id) return;
  var go = function () {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({block: 'start'});

  go();
  setTimeout(go, 0);
