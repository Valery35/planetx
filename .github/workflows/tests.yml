# Быстрая проверка модуля - тесты ядра на Python без QGIS на каждый
# коммит. Решение автора от 7 ноября 2026 года, AGENTS.md.
name: Тесты ядра

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: NumPy
        run: python -m pip install --quiet numpy
      - name: Тесты
        run: python -m unittest discover -s planetx/tests
