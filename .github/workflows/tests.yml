# Быстрая проверка модуля - тесты ядра на Python без QGIS на каждый
# коммит. Решение автора от 7 ноября 2026 года, AGENTS.md.
name: Тесты ядра

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: NumPy
        run: python -m pip install --quiet numpy
      - name: Тесты
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s planetx/tests 2>&1 | tee tests.log
      - name: Сводка
        if: always()
        shell: bash
        run: |
          {
            echo '```'
            grep -E '^(ERROR|FAIL):|^[A-Za-z]*Error|^Ran |^OK|^FAILED' tests.log | head -n 200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
