<meta charset="utf-8">

<title data-i18n="title"></title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700\
&family=Golos+Text:wght@400;500;600&display=swap');

:root{
  --paper:#EEF2F6; --paper-2:#E2E8EF; --ink:#131C26; --ink-soft:#4A5866;
  --teal:#1D5FA8; --teal-deep:#12457D; --amber:#C2622C;
  --line:rgba(19,28,38,.14); --r:14px; --maxw:1080px;
  --display:'Bitter',Georgia,serif;
  --body:'Golos Text','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
section[id],[id]{scroll-margin-top:74px}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;
  letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal-deep);margin-bottom:18px;
  display:inline-flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--amber);
  display:inline-block}
.hdr{position:sticky;top:0;z-index:20;background:rgba(238,242,246,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;
  height:62px;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px;
  font-family:var(--display);font-weight:700;text-decoration:none;
  font-size:20px}
.brand span{font-family:var(--body);font-weight:500;font-size:13px;
  color:var(--ink-soft)}
.right{display:flex;align-items:center;gap:22px}
.nav{display:flex;gap:22px;font-size:15px}
.nav a{text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--teal-deep)}
@media(max-width:860px){.nav{display:none}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;font-size:13px;font-weight:600}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;
  font:inherit;color:var(--ink-soft)}
.lang button.on{background:var(--teal);color:#fff}
.hero{padding:74px 0 48px}
.hero h1{font-size:clamp(34px,5vw,56px);max-width:18ch}
.hero .lead{margin-top:22px;font-size:20px;max-width:64ch;
  color:var(--ink-soft)}
.cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:var(--r);
  text-decoration:none;font-weight:600;font-size:16px}
.btn-main{background:var(--teal);color:#fff}
.btn-main:hover{background:var(--teal-deep)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal)}
section{padding:56px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,3.3vw,38px);max-width:24ch}
section .sub{margin-top:16px;max-width:70ch;color:var(--ink-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:34px}
@media(max-width:860px){.pair,.trio{grid-template-columns:1fr}}
.card{background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 24px}
.card h3{font-size:19px;margin-bottom:10px}
.card p{color:var(--ink-soft);font-size:16px}
.card p + p{margin-top:10px}
.card.key{margin-top:24px}
.card ol{margin:10px 0;padding-left:22px;color:var(--ink-soft);font-size:16px}
.card li + li{margin-top:6px}
.card a{color:var(--teal-deep)}
figure{margin:30px 0 0}
figure img{width:100%;height:auto;display:block;border-radius:var(--r);
  border:1px solid var(--line);background:#000}
.shot{margin-top:38px}
figcaption{margin-top:10px;font-size:14px;color:var(--ink-soft)}
.tools{margin-top:34px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:#fff}
.group{background:var(--paper-2);padding:10px 20px;font-weight:600;
  font-size:14px;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.tool{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:14px 20px;
  border-bottom:1px solid var(--line)}
.tool:last-child{border-bottom:0}
.num{font-family:var(--display);font-weight:700;color:var(--teal-deep)}
.txt b{display:block;font-size:16px}
.txt span{color:var(--ink-soft);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:40px}
@media(max-width:860px){.facts{grid-template-columns:1fr}}
.fact b{display:block;font-family:var(--display);font-size:30px;
  line-height:1.1}
.fact span{color:var(--ink-soft);font-size:15px}
.ftr{padding:40px 0 60px;border-top:1px solid var(--line);
  color:var(--ink-soft);font-size:15px}
.ftr a{color:var(--teal-deep)}

.nav a.on{color:var(--teal-deep);font-weight:600}
.card.link{display:block;text-decoration:none;color:inherit}
.card.link:hover{border-color:var(--teal)}
.card.link h3{color:var(--teal-deep)}
.row{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:14px;
  padding:10px 20px;border-bottom:1px solid var(--line);font-size:15px}
.row span{color:var(--ink-soft)}
.row .src{display:block;font-style:normal;font-size:13px;margin-top:3px;
  color:var(--teal-deep)}
@media(max-width:860px){.row{grid-template-columns:1fr}}
figure.narrow{max-width:620px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;
  margin-top:34px}
.side figure{margin:0}
.side .row{grid-template-columns:1fr;gap:4px}
@media(max-width:860px){.side{grid-template-columns:1fr}}
.release{margin-top:20px}
.release .date{color:var(--ink-soft);font-size:14px;margin:2px 0 8px}
.release ul{margin:0;padding-left:20px;color:var(--ink-soft);font-size:16px}
.release li + li{margin-top:6px}
.release div p{color:var(--ink-soft);font-size:16px}
</style>

<script>
var TEXTS = {"ru": {"hero.eyebrow": "Плагин QGIS · 3D-глобус", "hero.h1": "Вся Земля в окне QGIS, от космоса до улицы", "hero.lead": "PlanetX открывает глобус в QGIS. Космоснимки лежат на рельефе, вокруг планеты светится атмосфера, границы, дороги и названия включаются флажками. Слои текущего проекта ложатся на глобус в порядке карты, рядом - открытые данные о Земле от недр до неба.", "hero.shot": "Кавказ с наклоном камеры. Эльбрус, Сванетия, вершины с высотой, заповедники и национальные парки.", "cta.release": "Скачать выпуск", "cta.install": "Каталог модулей QGIS", "cta.code": "Исходный код", "cta.manual": "Руководство PDF", "cta.manual.url": "https://github.com/Valery35/planetx/releases/latest/download/PlanetX.pdf", "tasks.create.h": "Создавать", "tasks.create.p": "Метки, пути, многоугольники, круги, картинки на поверхности и 3D-модели на рельефе. KML и KMZ из Google Earth открываются с папками, видами, временем и турами.", "tasks.present.h": "Показывать", "tasks.present.p": "Туры с подписями остановок, своими слоями и временем, запись видео MP4, сцена одним файлом, страница HTML с глобусом.", "tasks.measure.h": "Измерять", "tasks.measure.p": "Длина и площадь по рельефу, профиль высот с водой морей и озёр, видимость из точки, часы солнца, маршрут, номер листа карты.", "tasks.project.h": "Работать с проектом QGIS", "tasks.project.p": "Слои проекта на рельефе, свой рельеф до 1 м и батиметрия, гриды и скважины под землёй, геологический разрез вдоль пути.", "tasks.data.h": "Изучать данные о Земле", "tasks.data.p": "Около 90 карт и слоёв - геология и геофизика, землетрясения с 1904 года, воды, почвы, погода, темы NASA, энергетика.", "tasks.imagery.h": "Брать космоснимки", "tasks.imagery.p": "Sentinel-2, Landsat с 1972 года, ASTER и MODIS участком в проект QGIS - каналы, индексы, температура, ряд по датам.", "tasks.eyebrow": "Что можно делать", "tasks.h2": "От меток и туров до разреза под участком", "idea.fig": "Окно глобуса над Пермью с 13 км. Слева разделы «Метки», «Проект QGIS» и «Слои», вверху панель значков, справа кольцо навигации.", "idea.c1.h": "Подложка и рельеф", "idea.c1.p": "Esri World Imagery как пример, OpenStreetMap, OpenTopoMap, готовые снимки и карты или любое подключение XYZ Tiles. Рельеф Terrarium, Copernicus DEM 30 м или GEDTM30, дно морей по сетке GEBCO 2026.", "idea.c2.h": "Ровные подписи", "idea.c2.p": "Названия стран, городов, рек, вершин с высотой, заповедников и номера дорог из векторной основы OpenFreeMap. Надписи ровные при любом повороте, язык - QGIS, местный или один из 15.", "idea.c3.h": "Атмосфера и свет", "idea.c3.p": "Свечение воздуха, небо у горизонта, свет солнца на дату и время, ночная сторона с огнями городов, 3D-здания OpenFreeMap.", "idea.eyebrow": "Как устроен глобус", "idea.h2": "Своё окно, свой движок, данные из открытых источников", "idea.sub": "Глобус рисуется на OpenGL 3.3 собственным движком, а не штатным 3D-видом QGIS. Тайлы подложки, высот и векторной основы идут через сетевые настройки и кэш QGIS. В видеокарту попадают только смещения от центра тайла и от глаза, на уровне улиц картинка не дрожит. Работает в QGIS 3.36 и новее и в QGIS 4, на Windows и Linux.", "k1": "ЛКМ", "c1.h": "Захват Земли", "c1.p": "Точка под курсором следует за мышью, после отпускания Земля вращается по инерции. Двойной щелчок - перелёт к точке.", "k2": "Колесо", "c2.h": "Приближение к курсору", "c2.p": "Колесо приближает к точке под курсором, точка остаётся на месте.", "k3": "СКМ", "c3.h": "Поворот и наклон", "c3.p": "Средняя кнопка или левая с Shift поворачивают и наклоняют вид, левая с Ctrl сдвигает его вдоль экрана.", "k4": "N U R", "c4.h": "Север, отвесно, сброс", "c4.p": "N ставит север вверх, U - отвесный взгляд, R - то и другое. Стрелки сдвигают вид, PageUp и PageDown приближают.", "k5": "Ctrl+K", "c5.h": "Строка «Поиск»", "c5.p": "Место, координаты в градусах, UTM или MGRS, слой, окно или инструмент по названию. Enter выполняет действие или перелетает к месту.", "k6": "Угол", "c6.h": "Кольцо навигации", "c6.p": "Кольцо компаса, джойстики взгляда и сдвига, ползунок высоты. Точка в середине кольца возвращает отвесный взгляд.", "k7": "F11", "c7.h": "Во весь экран", "c7.p": "Панели прячутся, остаются глобус, навигация, шкала времени и тур - для показа.", "controls.eyebrow": "Управление", "controls.h2": "Навигация мышью и клавиатурой", "worlds.mars": "Марс. Вулканы Фарсиды и долины Маринер, мозаика Viking.", "worlds.moon": "Видимая сторона Луны, карта альбедо LOLA с отмывкой рельефа.", "worlds.sky": "Небо 1 октября 2026 года. Орион, Телец и Близнецы, Луна у Плеяд.", "worlds.eyebrow": "Другие тела и небо", "worlds.h2": "Марс, Луна и звёздное небо", "worlds.sub": "Значок «Тело» заменяет Землю Марсом, Луной и ещё 14 телами по мозаикам USGS и NASA, у Марса и Луны - с рельефом. Навигация, метки, туры и линейка работают на любом теле. Пункт «Небо» показывает 5080 звёзд, 88 созвездий, Солнце, Луну и планеты на выбранный момент.", "fam.a": "Открыть в каталоге QGIS", "fam.c1.p": "Кригинг, изолинии, рельеф и водосборы, разрезы с чертежами, геологическая модель пласта.", "fam.c2.p": "Чистка топологии контуров и полигонов, прореживание с сохранением топологии.", "fam.c3.p": "Тела пластов, скважины и разрезы в объёме, карта текстурой на рельефе, блочная модель.", "family.eyebrow": "Набор плагинов", "family.h2": "PlanetX в линейке Информ++", "family.sub": "Isoliner строит контуры, Topoliner приводит их в порядок, Isoliner3D показывает геологию в объёме, PlanetX показывает Землю целиком. Все плагины работают независимо.", "title": "PlanetX - Главная · Информ++", "brand.sub": "для QGIS", "nav.main": "Главная", "nav.places": "Метки", "nav.project": "Проект QGIS", "nav.data": "Данные", "nav.imagery": "Космоснимки", "nav.news": "Что нового", "ftr.line1": "лицензия GNU GPL v3 · QGIS 3.36 и новее, QGIS 4", "ftr.line2": "Разработано ООО «Информ++»", "ftr.line3": "Космоснимки Esri, Vantor, Earthstar Geographics, and the GIS User Community. Картографические данные © участники OpenStreetMap, векторные тайлы OpenFreeMap. Рельеф Mapzen Terrain Tiles. Марс - NASA, USGS, Viking MDIM2.1, тайлы OpenPlanetaryMap, Луна - NASA, GSFC, ASU, LRO LROC WAC, USGS. Созвездия и имена звёзд - d3-celestial, © Olaf Frohn. Темы, огни и пожары - NASA GIBS, Black Marble, FIRMS. Землетрясения и плиты Slab2 - USGS, кора - CRUST1.0, палеогеография - PALEOMAP PaleoDEM.", "ftr.free": "Модуль бесплатный и открытый.", "ftr.support": "Поддержать разработку"}, "en": {"hero.eyebrow": "QGIS plugin · 3D globe", "hero.h1": "The whole Earth in a QGIS window, from space to the street", "hero.lead": "PlanetX opens a globe right inside QGIS. Satellite imagery lies on the terrain, the atmosphere glows around the planet, and borders, roads and names are switched on with check boxes. Layers of the current project lie on the globe in the map order, next to open data about the Earth from its depths to the sky.", "hero.shot": "The Caucasus with a tilted camera. Elbrus, Svaneti, peaks with their heights, nature reserves and national parks.", "cta.release": "Download the release", "cta.install": "QGIS plugin catalogue", "cta.code": "Source code", "cta.manual": "Manual PDF", "cta.manual.url": "https://github.com/Valery35/planetx/releases/latest/download/PlanetX_en.pdf", "tasks.create.h": "Create", "tasks.create.p": "Placemarks, paths, polygons, circles, surface images and 3D models on the terrain. KML and KMZ from Google Earth open with folders, views, time and tours.", "tasks.present.h": "Present", "tasks.present.p": "Tours with stop captions, own layers and time, MP4 video recording, a scene in one file, an HTML page with the globe.", "tasks.measure.h": "Measure", "tasks.measure.p": "Length and area along the terrain, an elevation profile with the water of seas and lakes, viewshed, hours of sun, a route, a map sheet number.", "tasks.project.h": "Work with the QGIS project", "tasks.project.p": "Project layers on the terrain, own terrain down to 1 m and bathymetry, grids and boreholes underground, a geological section along a path.", "tasks.data.h": "Study Earth data", "tasks.data.p": "About 90 maps and layers - geology and geophysics, earthquakes since 1904, water, soils, weather, NASA themes, energy.", "tasks.imagery.h": "Get satellite images", "tasks.imagery.p": "Sentinel-2, Landsat since 1972, ASTER and MODIS of an area into the QGIS project - bands, indices, temperature, time series.", "tasks.eyebrow": "What you can do", "tasks.h2": "From placemarks and tours to a section under a site", "idea.fig": "The globe window over Perm from 13 km. On the left the Places, QGIS project and Layers sections, the icon bar on top, the navigation ring on the right.", "idea.c1.h": "Base map and terrain", "idea.c1.p": "Esri World Imagery as an example, OpenStreetMap, OpenTopoMap, ready imagery and maps or any XYZ Tiles connection. Terrarium, Copernicus DEM 30 m or GEDTM30 terrain, the sea floor from the GEBCO 2026 grid.", "idea.c2.h": "Upright labels", "idea.c2.p": "Names of countries, cities, rivers, peaks with heights, reserves and road numbers from the OpenFreeMap vector base. Labels stay upright at any turn, the language is that of QGIS, local or one of 15.", "idea.c3.h": "Atmosphere and light", "idea.c3.p": "The glow of the air, the sky at the horizon, sunlight for a date and time, the night side with city lights, OpenFreeMap 3D buildings.", "idea.eyebrow": "How the globe works", "idea.h2": "Its own window, its own engine, data from open sources", "idea.sub": "The globe is drawn with OpenGL 3.3 by its own engine rather than the built-in QGIS 3D view. Base map, terrain and vector tiles go through the QGIS network settings and cache. Only offsets from the tile centre and from the eye reach the graphics card, the picture does not jitter at street level. Works in QGIS 3.36 and later and in QGIS 4, on Windows and Linux.", "k1": "Left", "c1.h": "Grab the Earth", "c1.p": "The point under the cursor follows the mouse, after release the Earth keeps rotating by inertia. A double click flies to the point.", "k2": "Wheel", "c2.h": "Zoom to the cursor", "c2.p": "The wheel zooms to the point under the cursor, and the point stays in place.", "k3": "Middle", "c3.h": "Turn and tilt", "c3.p": "The middle button or Shift with the left button turns and tilts the view, Ctrl with the left button shifts it along the screen.", "k4": "N U R", "c4.h": "North, down, reset", "c4.p": "N puts north up, U looks straight down, R does both. The arrows move the view, PageUp and PageDown zoom.", "k5": "Ctrl+K", "c5.h": "The Search line", "c5.p": "A place, coordinates in degrees, UTM or MGRS, a layer, a window or a tool by name. Enter runs the action or flies to the place.", "k6": "Corner", "c6.h": "Navigation ring", "c6.p": "The compass ring, the look and move sticks, the height slider. The dot in the middle of the ring returns the straight down view.", "k7": "F11", "c7.h": "Full screen", "c7.p": "The panels hide, the globe, navigation, time slider and tour stay - for presentations.", "controls.eyebrow": "Controls", "controls.h2": "Mouse and keyboard navigation", "worlds.mars": "Mars. The Tharsis volcanoes and Valles Marineris, Viking mosaic.", "worlds.moon": "The near side of the Moon, LOLA albedo map with hill shading.", "worlds.sky": "The sky on 1 October 2026. Orion, Taurus and Gemini, the Moon at the Pleiades.", "worlds.eyebrow": "Other bodies and the sky", "worlds.h2": "Mars, the Moon and the starry sky", "worlds.sub": "The Body icon replaces the Earth with Mars, the Moon and 14 more bodies from USGS and NASA mosaics, Mars and the Moon with terrain. Navigation, places, tours and the ruler work on any body. The Sky item shows 5080 stars, 88 constellations, the Sun, the Moon and the planets at the chosen moment.", "fam.a": "Open in the QGIS catalogue", "fam.c1.p": "Kriging, isolines, relief and catchments, sections with drawings, a geological bed model.", "fam.c2.p": "Topology cleaning of contours and polygons, thinning that preserves topology.", "fam.c3.p": "Bed bodies, boreholes and sections in three dimensions, a map draped on the relief, a block model.", "family.eyebrow": "The set of plugins", "family.h2": "PlanetX in the Inform++ family", "family.sub": "Isoliner builds contours, Topoliner puts them in order, Isoliner3D shows geology in three dimensions, PlanetX shows the whole Earth. All plugins work independently.", "title": "PlanetX - Overview · Inform++", "brand.sub": "for QGIS", "nav.main": "Overview", "nav.places": "Places", "nav.project": "QGIS project", "nav.data": "Data", "nav.imagery": "Satellite imagery", "nav.news": "What's new", "ftr.line1": "GNU GPL v3 · QGIS 3.36 and newer, QGIS 4", "ftr.line2": "Developed by Inform++ LLC", "ftr.line3": "Imagery Esri, Vantor, Earthstar Geographics, and the GIS User Community. Map data © OpenStreetMap contributors, vector tiles OpenFreeMap. Terrain Mapzen Terrain Tiles. Mars - NASA, USGS, Viking MDIM2.1, the Moon - NASA, GSFC, ASU, LRO LROC WAC, USGS. Constellations and star names - d3-celestial, © Olaf Frohn. Themes, lights and fires - NASA GIBS, Black Marble, FIRMS. Earthquakes and Slab2 slabs - USGS, crust - CRUST1.0, paleogeography - PALEOMAP PaleoDEM.", "ftr.free": "The plugin is free and open source.", "ftr.support": "Support development"}};
function apply(lang){
  var d = TEXTS[lang] || TEXTS.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n')];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll('[data-i18n-attr]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-attr')];
    if (value !== undefined) el.setAttribute('content', value);
  });
  document.querySelectorAll('[data-i18n-href]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-href')];
    if (value !== undefined) el.setAttribute('href', value);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  try { localStorage.setItem('planetx-lang', lang); } catch (e) {}
}

// Меню прокручивает кодом, а не якорем. Внутри CMS ссылка вида
// «#idea» может вести на другую страницу.
document.querySelectorAll('.nav a[href^="#"]').forEach(function(a){
  a.addEventListener('click', function(ev){
    var el = document.getElementById(a.getAttribute('href').slice(1));
    if (!el) return;
    ev.preventDefault();
    el.scrollIntoView({behavior: 'smooth', block: 'start'});
  });
});

document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){
    apply(b.getAttribute('data-lang'));
  });
});

// По умолчанию русский: страница живёт на русском сайте.
var saved = null;
try { saved = localStorage.getItem('planetx-lang'); } catch (e) {}
apply(saved || 'ru');

// Тексты подставляются после разбора страницы, переход по адресу
// с решёткой доводится до места вручную.
(function () {
  var id = (location.hash || '').slice(1);
  if (!id) return;
  var go = function () {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({block: 'start'});
  };
  go();
  setTimeout(go, 0);
  window.addEventListener('load', go);
})();
</script>
