<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title"></title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700\
&family=Golos+Text:wght@400;500;600&display=swap');

:root{
  --paper:#EEF2F6; --paper-2:#E2E8EF; --ink:#131C26; --ink-soft:#4A5866;
  --teal:#1D5FA8; --teal-deep:#12457D; --amber:#C2622C;
  --line:rgba(19,28,38,.14); --r:14px; --maxw:1080px;
  --display:'Bitter',Georgia,serif;
  --body:'Golos Text','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
section[id],[id]{scroll-margin-top:74px}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;
  letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal-deep);margin-bottom:18px;
  display:inline-flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--amber);
  display:inline-block}
.hdr{position:sticky;top:0;z-index:20;background:rgba(238,242,246,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;
  height:62px;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px;
  font-family:var(--display);font-weight:700;text-decoration:none;
  font-size:20px}
.brand span{font-family:var(--body);font-weight:500;font-size:13px;
  color:var(--ink-soft)}
.right{display:flex;align-items:center;gap:22px}
.nav{display:flex;gap:22px;font-size:15px}
.nav a{text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--teal-deep)}
@media(max-width:860px){.nav{display:none}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;font-size:13px;font-weight:600}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;
  font:inherit;color:var(--ink-soft)}
.lang button.on{background:var(--teal);color:#fff}
.hero{padding:74px 0 48px}
.hero h1{font-size:clamp(34px,5vw,56px);max-width:18ch}
.hero .lead{margin-top:22px;font-size:20px;max-width:64ch;
  color:var(--ink-soft)}
.cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:var(--r);
  text-decoration:none;font-weight:600;font-size:16px}
.btn-main{background:var(--teal);color:#fff}
.btn-main:hover{background:var(--teal-deep)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal)}
section{padding:56px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,3.3vw,38px);max-width:24ch}
section .sub{margin-top:16px;max-width:70ch;color:var(--ink-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:34px}
@media(max-width:860px){.pair,.trio{grid-template-columns:1fr}}
.card{background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 24px}
.card h3{font-size:19px;margin-bottom:10px}
.card p{color:var(--ink-soft);font-size:16px}
.card p + p{margin-top:10px}
.card.key{margin-top:24px}
.card ol{margin:10px 0;padding-left:22px;color:var(--ink-soft);font-size:16px}
.card li + li{margin-top:6px}
.card a{color:var(--teal-deep)}
figure{margin:30px 0 0}
figure img{width:100%;height:auto;display:block;border-radius:var(--r);
  border:1px solid var(--line);background:#000}
.shot{margin-top:38px}
figcaption{margin-top:10px;font-size:14px;color:var(--ink-soft)}
.tools{margin-top:34px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:#fff}
.group{background:var(--paper-2);padding:10px 20px;font-weight:600;
  font-size:14px;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.tool{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:14px 20px;
  border-bottom:1px solid var(--line)}
.tool:last-child{border-bottom:0}
.num{font-family:var(--display);font-weight:700;color:var(--teal-deep)}
.txt b{display:block;font-size:16px}
.txt span{color:var(--ink-soft);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:40px}
@media(max-width:860px){.facts{grid-template-columns:1fr}}
.fact b{display:block;font-family:var(--display);font-size:30px;
  line-height:1.1}
.fact span{color:var(--ink-soft);font-size:15px}
.ftr{padding:40px 0 60px;border-top:1px solid var(--line);
  color:var(--ink-soft);font-size:15px}
.ftr a{color:var(--teal-deep)}

.nav a.on{color:var(--teal-deep);font-weight:600}
.card.link{display:block;text-decoration:none;color:inherit}
.card.link:hover{border-color:var(--teal)}
.card.link h3{color:var(--teal-deep)}
.row{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:14px;
  padding:10px 20px;border-bottom:1px solid var(--line);font-size:15px}
.row span{color:var(--ink-soft)}
.row .src{display:block;font-style:normal;font-size:13px;margin-top:3px;
  color:var(--teal-deep)}
@media(max-width:860px){.row{grid-template-columns:1fr}}
figure.narrow{max-width:620px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;
  margin-top:34px}
.side figure{margin:0}
.side .row{grid-template-columns:1fr;gap:4px}
@media(max-width:860px){.side{grid-template-columns:1fr}}
.release{margin-top:20px}
.release .date{color:var(--ink-soft);font-size:14px;margin:2px 0 8px}
.release ul{margin:0;padding-left:20px;color:var(--ink-soft);font-size:16px}
.release li + li{margin-top:6px}
.release div p{color:var(--ink-soft);font-size:16px}
</style>

<script>
var TEXTS = {"ru": {"store.fig": "Демо «Пермь» со шкалой времени на 11:30-13:00. Эспланада, маршрут прогулки, путь и 3D-здания.", "kinds.r1.h": "Метка", "kinds.r1.p": "Точка со значком из 35 стандартных или из библиотеки SVG QGIS, подпись, цвет и размер.", "kinds.r2.h": "Путь и многоугольник", "kinds.r2.p": "Линия и область по дугам большого круга, сгущение по рельефу. Вершины тянутся мышью, середина отрезка ставит новую.", "kinds.r3.h": "Круг", "kinds.r3.p": "Центр и точка окружности, кольцо на эллипсоиде из 128 вершин.", "kinds.r4.h": "3D-путь и 3D-многоугольник", "kinds.r4.p": "Точки садятся на крыши и стены 3D-зданий, длина - прямыми отрезками, площадь и наклон - в плоскости фигуры.", "kinds.r5.h": "Картинки", "kinds.r5.p": "На поверхности рамкой с поворотом или четырьмя углами, фото с камерой в пространстве, картинка на экране. Файл или ссылка с обновлением через промежуток.", "kinds.r6.h": "3D-модели", "kinds.r6.p": "Collada, glTF и OBJ с картинками. Модель ставится на место ручками рамки - сдвиг, поворот, масштаб, хранится ссылкой на файл.", "kinds.r7.h": "Папки", "kinds.r7.p": "Вложенные папки, группа переключателей, перенос мышью, выделение нескольких строк, ползунок непрозрачности.", "kinds.r8.h": "Сетевые ссылки", "kinds.r8.p": "Папка с документом KML по адресу, обновление через промежуток - например лента землетрясений USGS.", "store.eyebrow": "Мои метки", "store.h2": "Свои объекты на глобусе в одном файле", "store.sub": "Метки, пути, многоугольники, круги, картинки, 3D-модели и туры лежат в разделе «Метки» левой панели. Хранилище - один файл GeoPackage в профиле QGIS, метки видны в любом проекте. Объекты рисуются щелчками по глобусу и садятся на рельеф, их можно поднять над землёй и выдавить до неё.", "props.r1.h": "Оформление", "props.r1.p": "Цвета линии и заливки с прозрачностью, толщина, значок, поток штрихов по пути для схем логистики.", "props.r2.h": "Высота", "props.r2.p": "Подъём над рельефом с ползунком и выдавливание до земли - стена у линии, столбик у точки.", "props.r3.h": "Время", "props.r3.p": "Момент или промежуток. Шкала времени показывает метки своего промежутка, путь с промежутком растёт по шкале.", "props.r4.h": "Скрывать дальше", "props.r4.p": "Метка или папка видна только ближе заданного расстояния, Region KML.", "props.r5.h": "Вид метки", "props.r5.p": "Точка взгляда, расстояние, азимут и наклон, дата вида, включённые слои, сектор разреза и непрозрачности строк. Перелёт и тур возвращают их целиком.", "props.r6.h": "Описание", "props.r6.p": "Текст или HTML, как в KML. Показывается в карточке, в подписи остановки тура и в окне «Объекты».", "props.eyebrow": "Свойства метки", "props.h2": "Вид, время и показ каждой метки", "props.sub": "Окно свойств стоит в панели справа от вида и не мешает глобусу. Правка видна на глобусе сразу, «OK» её записывает. Щелчок по метке на глобусе открывает карточку с описанием и кнопкой «Объясни это» - вопросом помощнику об этой метке.", "measure.ruler": "Линейка - путь 11.5 км на карте и 12.47 км по рельефу через Эльбрус.", "measure.profile": "Профиль высот того же пути - высоты, набор и потеря высоты, средний и наибольший уклон.", "measure.lake": "Профиль 3 км через Бриенцское озеро по своей батиметрии. Дно на 308 м, вода до уровня 564 м.", "measure.trench": "Профиль 221 км через Марианский жёлоб по сетке GEBCO 2026. Дно до -10 797 м.", "tools.r1.h": "Линейка", "tools.r1.p": "Линия, путь, многоугольник, круг, 3D-путь и 3D-многоугольник. Длина на эллипсоиде и по рельефу, площадь, курс линии, единицы на выбор.", "tools.r2.h": "Профиль высот", "tools.r2.p": "До 2000 точек по самому точному уровню высот, набор и потеря высоты, уклон, вода морей и своих водоёмов, точка под курсором на глобусе.", "tools.r3.h": "Видимость из точки", "tools.r3.p": "Что видно с высоты наблюдателя в круге до десятков километров с учётом кривизны и рефракции.", "tools.r4.h": "Инсоляция", "tools.r4.p": "Часы прямого солнца в сутки за промежуток дат с тенями от рельефа.", "tools.r5.h": "Маршрут", "tools.r5.p": "На машине, пешком или на велосипеде. Сервис OSRM до тысяч километров, по тайлам основы - до 50 км без сервиса.", "tools.r6.h": "Номер листа карты", "tools.r6.p": "IMW 1:1 000 000, российская номенклатура до 1:200 000, NATO JOG и квадрат MGRS в точке.", "measure.eyebrow": "Измерения", "measure.h2": "Линейка, профиль высот и анализ у метки", "measure.sub": "Измерение сохраняется меткой. Меню пути и точки «Моих меток» открывает профиль высот, разрез Земли вниз, разрез модели, видимость, инсоляцию и снимки спутников у метки. Профиль знает уровень моря и воду своих водоёмов.", "tour.r1.h": "Темп остановки", "tour.r1.p": "Своя пауза и скорость перелёта у каждой метки, тур по кругу для показа без присмотра.", "tour.r2.h": "Плавная смена", "tour.r2.p": "Перелёт по методу van Wijk и Nuij, слои остановки проявляются за полсекунды.", "tour.r3.h": "Запись", "tour.r3.p": "Видео MP4 в размере окна или кадры PNG до 3840×2160, каждый кадр ждёт загрузки тайлов, подписи остановок в кадре.", "tour.r4.h": "Запись облёта", "tour.r4.p": "Движение камеры записывается меткой-туром, путь облёта правится мышью.", "tours.eyebrow": "Туры и показ", "tours.h2": "Облёт меток с подписями и запись видео", "tours.sub": "Тур облетает отмеченные метки папки по порядку списка. Каждая остановка возвращает свой вид, время, слои и сектор разреза. Подпись остановки стоит внизу кадра. Клавиши → и ← ведут по остановкам, пробел ставит паузу, на паузе вид вертят мышью.", "share.r1.h": "KML и KMZ", "share.r1.p": "Открытие и запись папок, стилей, видов, времени, Region, треков gx:Track, туров gx:Tour, картинок и моделей. Файлы Google Earth открываются, копия в буфер обмена вставляется в Google Earth.", "share.r2.h": "Сцена", "share.r2.p": "Файл .planetx - камера, время, слои проекта ссылкой, строки «Слоёв», сектор разреза и метки сцены. Открывается на другом компьютере.", "share.r3.h": "Поделиться видом", "share.r3.p": "Страница HTML с глобусом, метками и облётом открывается в браузере без QGIS.", "share.r4.h": "Помощник", "share.r4.p": "Метки по описанию одним запросом - «Путешествия Колумба» с датами этапов, разговор с действиями модуля. Claude, Grok, DeepSeek, OpenRouter или своя модель.", "share.r5.h": "Демо", "share.r5.p": "Подготовленные сцены - Пермь, Японский жёлоб, Аральское море, Москва в исторических картах, карьер, Бриенцское озеро, 3D-модели, Марс, Луна, небо.", "share.aral": "Демо «Аральское море». Снимки MODIS 2000, 2014 и 2023 годов по ссылкам, фото и карта на экране.", "share.models": "Демо «3D-модели» - церковь Покрова в Перми, модель Collada на своём месте.", "share.eyebrow": "Обмен", "share.h2": "KML, сцены, страница HTML и помощник", "title": "PlanetX - Метки · Информ++", "brand.sub": "для QGIS", "nav.main": "Главная", "nav.places": "Метки", "nav.project": "Проект QGIS", "nav.data": "Данные", "nav.imagery": "Космоснимки", "nav.news": "Что нового", "ftr.line1": "лицензия GNU GPL v3 · QGIS 3.36 и новее, QGIS 4", "ftr.line2": "Разработано ООО «Информ++»", "ftr.line3": "Космоснимки Esri, Vantor, Earthstar Geographics, and the GIS User Community. Картографические данные © участники OpenStreetMap, векторные тайлы OpenFreeMap. Рельеф Mapzen Terrain Tiles. Марс - NASA, USGS, Viking MDIM2.1, тайлы OpenPlanetaryMap, Луна - NASA, GSFC, ASU, LRO LROC WAC, USGS. Созвездия и имена звёзд - d3-celestial, © Olaf Frohn. Темы, огни и пожары - NASA GIBS, Black Marble, FIRMS. Землетрясения и плиты Slab2 - USGS, кора - CRUST1.0, палеогеография - PALEOMAP PaleoDEM.", "ftr.free": "Модуль бесплатный и открытый.", "ftr.support": "Поддержать разработку"}, "en": {"store.fig": "The Perm demo with the time slider at 11:30-13:00. The Esplanade, the walk route, a path and 3D buildings.", "kinds.r1.h": "Placemark", "kinds.r1.p": "A point with one of 35 standard icons or an icon from the QGIS SVG library, a label, colour and size.", "kinds.r2.h": "Path and polygon", "kinds.r2.p": "A line and an area along great circle arcs, densified over the terrain. Vertices are dragged with the mouse, the middle of a segment adds a new one.", "kinds.r3.h": "Circle", "kinds.r3.p": "A centre and a point of the circle, a ring of 128 vertices on the ellipsoid.", "kinds.r4.h": "3D path and 3D polygon", "kinds.r4.p": "Points sit on roofs and walls of 3D buildings, the length is measured in straight segments, the area and tilt in the plane of the shape.", "kinds.r5.h": "Images", "kinds.r5.p": "On the surface with a rotated box or four corners, a photo with its camera in space, an image on the screen. A file or a link refreshed at an interval.", "kinds.r6.h": "3D models", "kinds.r6.p": "Collada, glTF and OBJ with textures. The model is placed with the handles of its box - move, turn, scale, kept as a link to the file.", "kinds.r7.h": "Folders", "kinds.r7.p": "Nested folders, radio groups, drag and drop, selecting several rows, an opacity slider.", "kinds.r8.h": "Network links", "kinds.r8.p": "A folder with a KML document at an address, refreshed at an interval - for example the USGS earthquake feed.", "store.eyebrow": "My places", "store.h2": "Your own objects on the globe in one file", "store.sub": "Placemarks, paths, polygons, circles, images, 3D models and tours live in the Places section of the left panel. The store is one GeoPackage file in the QGIS profile, places are visible in any project. Objects are drawn with clicks on the globe and sit on the terrain, they can be raised above the ground and extruded down to it.", "props.r1.h": "Style", "props.r1.p": "Line and fill colours with transparency, width, icon, a flow of dashes along a path for logistics diagrams.", "props.r2.h": "Height", "props.r2.p": "Lift above the terrain with a slider and extrusion down to the ground - a wall for a line, a column for a point.", "props.r3.h": "Time", "props.r3.p": "A moment or an interval. The time slider shows the places of its interval, a path with an interval grows along the slider.", "props.r4.h": "Hide beyond", "props.r4.p": "A placemark or a folder is visible only closer than a given distance, KML Region.", "props.r5.h": "Placemark view", "props.r5.p": "Look-at point, distance, heading and tilt, view date, layers switched on, the cutaway sector and row opacities. A flight and a tour bring them all back.", "props.r6.h": "Description", "props.r6.p": "Text or HTML, as in KML. Shown in the card, in the tour stop caption and in the Identify window.", "props.eyebrow": "Placemark properties", "props.h2": "View, time and display of each placemark", "props.sub": "The properties window stands in the panel to the right of the view and does not cover the globe. Edits show on the globe at once, OK saves them. A click on a placemark on the globe opens its card with the description and the Explain this button - a question to the assistant about this placemark.", "measure.ruler": "The ruler - an 11.5 km path on the map and 12.47 km along the terrain across Elbrus.", "measure.profile": "The elevation profile of the same path - heights, ascent and descent, mean and greatest slope.", "measure.lake": "A 3 km profile across Lake Brienz from own bathymetry. The bed at 308 m, water up to the 564 m level.", "measure.trench": "A 221 km profile across the Mariana Trench from the GEBCO 2026 grid. The floor down to -10 797 m.", "tools.r1.h": "Ruler", "tools.r1.p": "Line, path, polygon, circle, 3D path and 3D polygon. Length on the ellipsoid and along the terrain, area, bearing, units of choice.", "tools.r2.h": "Elevation profile", "tools.r2.p": "Up to 2000 points from the finest height level, ascent and descent, slope, the water of seas and own lakes, the point under the cursor on the globe.", "tools.r3.h": "Viewshed", "tools.r3.p": "What is visible from the observer height within a circle of up to tens of kilometres with curvature and refraction.", "tools.r4.h": "Insolation", "tools.r4.p": "Hours of direct sun per day over a date range with terrain shadows.", "tools.r5.h": "Route", "tools.r5.p": "By car, on foot or by bicycle. The OSRM service up to thousands of kilometres, along base tiles - up to 50 km without the service.", "tools.r6.h": "Map sheet number", "tools.r6.p": "IMW 1:1 000 000, the Russian nomenclature down to 1:200 000, NATO JOG and the MGRS square at a point.", "measure.eyebrow": "Measuring", "measure.h2": "Ruler, elevation profile and analysis at a place", "measure.sub": "A measurement is saved as a placemark. The path and point menus of My Places open the elevation profile, the Earth section downwards, the model section, viewshed, insolation and satellite images at the place. The profile knows the sea level and the water of own lakes.", "tour.r1.h": "Stop pace", "tour.r1.p": "Its own pause and flight speed for each placemark, a looped tour for unattended shows.", "tour.r2.h": "Smooth change", "tour.r2.p": "A van Wijk and Nuij flight, the layers of a stop fade in over half a second.", "tour.r3.h": "Recording", "tour.r3.p": "MP4 video at the window size or PNG frames up to 3840×2160, each frame waits for the tiles, stop captions in the frame.", "tour.r4.h": "Recorded fly-through", "tour.r4.p": "The camera movement is recorded as a tour placemark, its path is edited with the mouse.", "tours.eyebrow": "Tours and presentation", "tours.h2": "A fly-through of places with captions and video recording", "tours.sub": "A tour flies over the checked places of a folder in list order. Each stop brings back its view, time, layers and cutaway sector. The stop caption stands at the bottom of the frame. The → and ← keys step through the stops, Space pauses, the view can be turned with the mouse during a pause.", "share.r1.h": "KML and KMZ", "share.r1.p": "Opening and writing folders, styles, views, time, Region, gx:Track tracks, gx:Tour tours, images and models. Google Earth files open, a copy to the clipboard pastes into Google Earth.", "share.r2.h": "Scene", "share.r2.p": "A .planetx file - camera, time, project layers by reference, Layers rows, the cutaway sector and the scene places. It opens on another computer.", "share.r3.h": "Share the view", "share.r3.p": "An HTML page with the globe, places and fly-through opens in a browser without QGIS.", "share.r4.h": "Assistant", "share.r4.p": "Places from a description in one request - Columbus voyages with dates of the legs, a conversation with plugin actions. Claude, Grok, DeepSeek, OpenRouter or a local model.", "share.r5.h": "Demos", "share.r5.p": "Prepared scenes - Perm, the Japan Trench, the Aral Sea, Moscow in historical maps, a quarry, Lake Brienz, 3D models, Mars, the Moon, the sky.", "share.aral": "The Aral Sea demo. MODIS images of 2000, 2014 and 2023 by links, a photo and a map on the screen.", "share.models": "The 3D models demo - the Church of the Intercession in Perm, a Collada model in its place.", "share.eyebrow": "Exchange", "share.h2": "KML, scenes, an HTML page and the assistant", "title": "PlanetX - Places · Inform++", "brand.sub": "for QGIS", "nav.main": "Overview", "nav.places": "Places", "nav.project": "QGIS project", "nav.data": "Data", "nav.imagery": "Satellite imagery", "nav.news": "What's new", "ftr.line1": "GNU GPL v3 · QGIS 3.36 and newer, QGIS 4", "ftr.line2": "Developed by Inform++ LLC", "ftr.line3": "Imagery Esri, Vantor, Earthstar Geographics, and the GIS User Community. Map data © OpenStreetMap contributors, vector tiles OpenFreeMap. Terrain Mapzen Terrain Tiles. Mars - NASA, USGS, Viking MDIM2.1, the Moon - NASA, GSFC, ASU, LRO LROC WAC, USGS. Constellations and star names - d3-celestial, © Olaf Frohn. Themes, lights and fires - NASA GIBS, Black Marble, FIRMS. Earthquakes and Slab2 slabs - USGS, crust - CRUST1.0, paleogeography - PALEOMAP PaleoDEM.", "ftr.free": "The plugin is free and open source.", "ftr.support": "Support development"}};
function apply(lang){
  var d = TEXTS[lang] || TEXTS.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n')];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll('[data-i18n-attr]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-attr')];
    if (value !== undefined) el.setAttribute('content', value);
  });
  document.querySelectorAll('[data-i18n-href]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-href')];
    if (value !== undefined) el.setAttribute('href', value);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  try { localStorage.setItem('planetx-lang', lang); } catch (e) {}
}

// Меню прокручивает кодом, а не якорем. Внутри CMS ссылка вида
// «#idea» может вести на другую страницу.
document.querySelectorAll('.nav a[href^="#"]').forEach(function(a){
  a.addEventListener('click', function(ev){
    var el = document.getElementById(a.getAttribute('href').slice(1));
    if (!el) return;
    ev.preventDefault();
    el.scrollIntoView({behavior: 'smooth', block: 'start'});
  });
});

document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){
    apply(b.getAttribute('data-lang'));
  });
});

// По умолчанию русский: страница живёт на русском сайте.
var saved = null;
try { saved = localStorage.getItem('planetx-lang'); } catch (e) {}
apply(saved || 'ru');

// Тексты подставляются после разбора страницы, переход по адресу
// с решёткой доводится до места вручную.
(function () {
  var id = (location.hash || '').slice(1);
  if (!id) return;
  var go = function () {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({block: 'start'});
  };
  go();
  setTimeout(go, 0);
  window.addEventListener('load', go);
})();
</script>
