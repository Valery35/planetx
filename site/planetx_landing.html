<!-- ============================================================ -->
<!-- PlanetX - лендинг для www.informpp.ru                          -->
<!-- Самодостаточная двуязычная страница: снимки встроены в файл,   -->
<!-- переключатель языка работает без перезагрузки.                 -->
<!-- Собирается скриптом tools/build_site.py, править лучше его:    -->
<!-- тексты обоих языков лежат там в одном месте.                   -->
<!-- ============================================================ -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" data-i18n-attr="desc" content="">
<title data-i18n="title"></title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700\
&family=Golos+Text:wght@400;500;600&display=swap');

:root{
  --paper:#EEF2F6; --paper-2:#E2E8EF; --ink:#131C26; --ink-soft:#4A5866;
  --teal:#1D5FA8; --teal-deep:#12457D; --amber:#C2622C;
  --line:rgba(19,28,38,.14); --r:14px; --maxw:1080px;
  --display:'Bitter',Georgia,serif;
  --body:'Golos Text','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
section[id],[id]{scroll-margin-top:74px}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;
  letter-spacing:-.01em}
p{margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal-deep);margin-bottom:18px;
  display:inline-flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--amber);
  display:inline-block}
.hdr{position:sticky;top:0;z-index:20;background:rgba(238,242,246,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;
  height:62px;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px;
  font-family:var(--display);font-weight:700;text-decoration:none;
  font-size:20px}
.brand span{font-family:var(--body);font-weight:500;font-size:13px;
  color:var(--ink-soft)}
.right{display:flex;align-items:center;gap:22px}
.nav{display:flex;gap:22px;font-size:15px}
.nav a{text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--teal-deep)}
@media(max-width:860px){.nav{display:none}}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;font-size:13px;font-weight:600}
.lang button{border:0;background:transparent;padding:6px 11px;cursor:pointer;
  font:inherit;color:var(--ink-soft)}
.lang button.on{background:var(--teal);color:#fff}
.hero{padding:74px 0 48px}
.hero h1{font-size:clamp(34px,5vw,56px);max-width:18ch}
.hero .lead{margin-top:22px;font-size:20px;max-width:64ch;
  color:var(--ink-soft)}
.cta{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:var(--r);
  text-decoration:none;font-weight:600;font-size:16px}
.btn-main{background:var(--teal);color:#fff}
.btn-main:hover{background:var(--teal-deep)}
.btn-ghost{border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--teal)}
section{padding:56px 0;border-top:1px solid var(--line)}
section h2{font-size:clamp(26px,3.3vw,38px);max-width:24ch}
section .sub{margin-top:16px;max-width:70ch;color:var(--ink-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:34px}
@media(max-width:860px){.pair,.trio{grid-template-columns:1fr}}
.card{background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 24px}
.card h3{font-size:19px;margin-bottom:10px}
.card p{color:var(--ink-soft);font-size:16px}
.card p + p{margin-top:10px}
figure{margin:30px 0 0}
figure img{width:100%;height:auto;display:block;border-radius:var(--r);
  border:1px solid var(--line);background:#000}
.shot{margin-top:38px}
figcaption{margin-top:10px;font-size:14px;color:var(--ink-soft)}
.tools{margin-top:34px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:#fff}
.group{background:var(--paper-2);padding:10px 20px;font-weight:600;
  font-size:14px;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.tool{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:14px 20px;
  border-bottom:1px solid var(--line)}
.tool:last-child{border-bottom:0}
.num{font-family:var(--display);font-weight:700;color:var(--teal-deep)}
.txt b{display:block;font-size:16px}
.txt span{color:var(--ink-soft);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
  margin-top:40px}
@media(max-width:860px){.facts{grid-template-columns:1fr}}
.fact b{display:block;font-family:var(--display);font-size:30px;
  line-height:1.1}
.fact span{color:var(--ink-soft);font-size:15px}
.ftr{padding:40px 0 60px;border-top:1px solid var(--line);
  color:var(--ink-soft);font-size:15px}
.ftr a{color:var(--teal-deep)}
</style>

<header class="hdr">
  <div class="wrap">
    <a class="brand" href="#">PlanetX
      <span data-i18n="brand.sub"></span></a>
    <div class="right">
      <nav class="nav">
        <a href="#idea" data-i18n="nav.idea"></a>
        <a href="#layers" data-i18n="nav.layers"></a>
        <a href="#project" data-i18n="nav.project"></a>
        <a href="#worlds" data-i18n="nav.worlds"></a>
        <a href="#controls" data-i18n="nav.controls"></a>
        <a href="#family" data-i18n="fam.eyebrow"></a>
      </nav>
      <div class="lang">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<script>
var TEXTS = {"ru": {"title": "PlanetX - трёхмерный глобус для QGIS · Информ++", "desc": "PlanetX показывает всю Землю в отдельном окне QGIS: космоснимки, рельеф, атмосферу, границы, дороги, подписи и слои проекта.", "brand.sub": "для QGIS", "nav.idea": "Глобус", "nav.layers": "Слои", "nav.project": "Проект", "nav.controls": "Управление", "hero.eyebrow": "Плагин QGIS · 3D-глобус", "hero.h1": "Вся Земля в окне QGIS, от космоса до улицы", "hero.lead": "PlanetX открывает глобус в QGIS. Космоснимки лежат на рельефе, вокруг планеты светится атмосфера, границы, дороги и названия включаются флажками. Слои текущего проекта ложатся на глобус в порядке карты.", "hero.shot": "Кавказ с наклоном камеры. Эльбрус, Сванетия, вершины с высотой, заповедники и национальные парки.", "cta.release": "Скачать выпуск", "cta.install": "Каталог модулей QGIS", "cta.code": "Исходный код", "cta.manual": "Руководство PDF", "cta.manual.url": "https://github.com/Valery35/planetx/releases/latest/download/PlanetX.pdf", "idea.eyebrow": "Как устроен глобус", "idea.h2": "Своё окно, свой движок, данные из открытых источников", "idea.sub": "Глобус рисуется на OpenGL 3.3 собственным движком, а не штатным 3D-видом QGIS. Камера держит точку взгляда, расстояние, азимут и наклон. Тайлы подложки, высот и векторной основы идут через сетевые настройки и кэш QGIS.", "idea.c1.h": "Космоснимки и рельеф", "idea.c1.p": "По умолчанию подложка - Esri World Imagery как пример. Её можно сменить на OpenStreetMap или на любое подключение XYZ Tiles из обозревателя QGIS. Рельеф Mapzen Terrain Tiles с отмывкой склонов, вертикальный масштаб настраивается.", "idea.c2.h": "Точность от космоса до метров", "idea.c2.p": "В видеокарту попадают только смещения от центра тайла и от глаза. На уровне улиц ошибка положения точки на экране меньше тысячной доли пикселя, картинка не дрожит.", "layers.eyebrow": "Панель «Слои»", "layers.h2": "Границы, дороги и названия поверх снимков", "layers.sub": "Внизу слева лежат группы «Границы и названия», «Транспорт» и «Природа». Данные берутся из векторных тайлов OpenFreeMap и ложатся по рельефу. Там же координатная сетка с экватором и тропиками, звёзды и облака NASA за последние полные сутки. Флажки срабатывают сразу.", "layers.fig": "Евразия с высоты 9000 км. Названия стран и городов, границы стран жёлтые, границы областей тонкие белые.", "layers.c1.h": "Ровные подписи", "layers.c1.p": "Надписи остаются ровными при любом повороте и наклоне и не налезают друг на друга. Пункт за горой или за горизонтом не подписан. При приближении появляются всё более мелкие пункты, вершины, аэропорты и номера дорог.", "layers.c2.h": "Язык подписей", "layers.c2.p": "По умолчанию подписи на языке QGIS. В свойствах вида выбираются местные названия или один из 15 языков, среди них русский, английский, немецкий, казахский и китайский.", "project.eyebrow": "Слои проекта", "project.h2": "Карта проекта ложится на глобус", "project.sub": "Векторные и растровые слои проекта рисует сам QGIS с их стилями и подписями, глобус кладёт картинку на рельеф в порядке карты. Отметка слоя в списке окна показывает его на глобусе и не меняет карту. Пункт меню «Подлететь» ведёт камеру к охвату слоя.", "project.fig": "Пермь с высоты 40 км. Магистрали, железные дороги, номера дорог и названия пунктов поверх космоснимка.", "places.eyebrow": "Метки, время, измерения", "places.h2": "Свои метки, их время и измерения", "places.sub": "Метки, пути и многоугольники рисуются щелчками по глобусу и хранятся в «Моих метках». У метки бывают значок, своё время и свой вид. Файлы KML и KMZ открываются и сохраняются. Сцена «Пермь» из набора «Демо» показывает эти возможности вместе.", "places.fig": "Демо «Пермь». Шкала времени на 11:30-13:00, видна Эспланада, маршрут прогулки и 3D-здания.", "places.c1.h": "Значки и время", "places.c1.p": "35 значков меток окрашиваются цветом метки. Момент или промежуток метки задаёт её место на шкале времени, метки вне промежутка скрыты.", "places.c2.h": "Линейка и профиль высот", "places.c2.p": "Длина на карте и по рельефу, курс, площадь. Профиль высот пути с набором высоты и уклонами. Координаты в градусах, UTM или MGRS.", "places.c3.h": "Туры", "places.c3.p": "Тур облетает метки или проигрывает запись движения камеры. Кнопка 🔁 повторяет тур по кругу. Тур записывается кадрами PNG для ролика.", "nav.worlds": "Тела и небо", "worlds.eyebrow": "Другие тела и небо", "worlds.h2": "Луна, Марс, другие тела и звёздное небо", "worlds.sub": "Значок «Тело» заменяет Землю Луной, Марсом или одним из 16 других тел. Снимки Марса - цветная мозаика Viking MDIM2.1, около 650 м на пиксель, снимки Луны - карта альбедо LOLA с отмывкой рельефа, около 670 м. Рельеф Марса построен по высотам MOLA, рельеф Луны - по высотам LOLA. Навигация, метки, туры, линейка и сцены работают на любом теле, метка хранит своё тело. Пункт «Небо» показывает небесную сферу изнутри - 5080 звёзд, 88 созвездий, Солнце, Луну и планеты на выбранный момент.", "worlds.mars": "Марс. Вулканы Фарсиды и долины Маринер, мозаика Viking.", "worlds.moon": "Видимая сторона Луны, карта альбедо LOLA с отмывкой рельефа.", "worlds.sky": "Небо 1 октября 2026 года. Орион, Телец и Близнецы, Луна у Плеяд, Марс в Раке.", "worlds.bodies": "Меркурий, Венера, Юпитер, Ио, Европа, Ганимед, Каллисто, Мимас, Энцелад, Тефия, Диона, Рея, Титан, Япет, Церера и Веста. Снимки - глобальные мозаики NASA и USGS по съёмке MESSENGER, Magellan, Galileo, Voyager, Cassini и Dawn.", "worlds.c1.h": "Положения светил", "worlds.c1.p": "Положения планет рассчитываются по кеплеровым элементам орбит JPL, положение Луны - по формулам Астрономического альманаха. Отклонение от эфемерид JPL Horizons в 1800-2050 годах не превышает 0.2° у планет и 0.3° у Луны.", "worlds.c2.h": "Метки и туры на небе", "worlds.c2.p": "Метка неба хранит направление взгляда и поле зрения. Тур по меткам неба расширяет поле зрения между удалёнными точками и сужает его у цели.", "worlds.c3.h": "Демо", "worlds.c3.p": "Значок с академической шапочкой открывает подготовленные сцены. На Земле это Пермь и Бока-Чика, на Марсе и Луне - места посадок аппаратов, на небе - созвездия и яркие объекты.", "controls.eyebrow": "Управление", "controls.h2": "Навигация мышью и клавиатурой", "controls.sub": "Значок «Свойства вида» открывает свойства вида, кнопка «О модуле» напоминает управление и источники.", "g1": "Мышь и клавиатура", "c1.h": "Захват Земли", "c1.p": "Точка под курсором следует за мышью. После отпускания Земля вращается по инерции.", "c2.h": "Приближение к курсору", "c2.p": "Колесо приближает к точке под курсором, точка остаётся на месте.", "c3.h": "Поворот и наклон", "c3.p": "Средняя кнопка или левая с Shift поворачивают и наклоняют вид, у горизонта видно небо.", "c4.h": "Поиск", "c4.p": "Название места или координаты и Enter. Камера плавно перелетает туда, место отмечено красной меткой.", "c5.h": "Обновление", "c5.p": "Новая подложка и слои проекта видны после кнопки «Обновить». Можно включить автоматическое обновление.", "k1": "ЛКМ", "k2": "Колесо", "k3": "СКМ", "k4": "Enter", "k5": "Кнопка", "c6.h": "Щелчки и клавиши", "c6.p": "Двойной щелчок подлетает к точке, правая кнопка приближает и отдаляет, Ctrl поворачивает взгляд. Стрелки, PageUp, PageDown, N, U и R управляют видом.", "c7.h": "Инструменты управления на экране", "c7.p": "В правом верхнем углу вида кольцо компаса, джойстики взгляда и сдвига и ползунок высоты. Вдали от курсора они стоят слабым контуром, у курсора видны целиком.", "k6": "2×", "k7": "Угол", "fact1": "кадров в секунду при вращении глобуса, не меньше, в любую секунду замера.", "fact2": "языков подписей и местные названия.", "fact3": "внешних зависимостей. PyOpenGL берётся из состава QGIS.", "fam.eyebrow": "Набор плагинов", "fam.h2": "PlanetX в линейке Информ++", "fam.sub": "Isoliner строит контуры, Topoliner приводит их в порядок, Isoliner3D показывает геологию в объёме, PlanetX показывает Землю целиком. Все плагины работают независимо.", "fam.c1.p": "Кригинг, изолинии, рельеф и водосборы, разрезы с чертежами, геологическая модель пласта.", "fam.c2.p": "Чистка топологии контуров и полигонов, прореживание с сохранением топологии.", "fam.c3.p": "Тела пластов, скважины и разрезы в объёме, карта текстурой на рельефе, блочная модель.", "fam.a": "Открыть в каталоге QGIS", "ftr.line1": "лицензия GNU GPL v3 · QGIS 3.36 и новее, QGIS 4", "ftr.line2": "Разработано ООО «Информ++»", "ftr.line3": "Космоснимки Esri, Vantor, Earthstar Geographics, and the GIS User Community. Картографические данные © участники OpenStreetMap, векторные тайлы OpenFreeMap. Рельеф Mapzen Terrain Tiles. Марс - NASA, USGS, Viking MDIM2.1, Луна - USGS, LRO LOLA, тайлы OpenPlanetaryMap. Высоты Марса - NASA MGS MOLA MEGDR, Луны - NASA LRO LOLA GDR. Созвездия и имена звёзд - d3-celestial, © Olaf Frohn."}, "en": {"title": "PlanetX - a 3D globe for QGIS · Inform++", "desc": "PlanetX shows the whole Earth in its own QGIS window: satellite imagery, terrain, atmosphere, borders, roads, labels and project layers.", "brand.sub": "for QGIS", "nav.idea": "Globe", "nav.layers": "Layers", "nav.project": "Project", "nav.controls": "Controls", "hero.eyebrow": "QGIS plugin · 3D globe", "hero.h1": "The whole Earth in a QGIS window, from space to the street", "hero.lead": "PlanetX opens a globe right inside QGIS. Satellite imagery lies on the terrain, the atmosphere glows around the planet, and borders, roads and names are switched on with check boxes. Layers of the current project lie on the globe in the map order.", "hero.shot": "The Caucasus with a tilted camera. Elbrus, Svaneti, peaks with their heights, nature reserves and national parks.", "cta.release": "Download the release", "cta.install": "QGIS plugin catalogue", "cta.code": "Source code", "cta.manual": "Manual PDF", "cta.manual.url": "https://github.com/Valery35/planetx/releases/latest/download/PlanetX_en.pdf", "idea.eyebrow": "How the globe works", "idea.h2": "Its own window, its own engine, data from open sources", "idea.sub": "The globe is drawn with OpenGL 3.3 by its own engine rather than the built-in QGIS 3D view. The camera holds the look-at point, distance, heading and tilt. Base map, terrain and vector tiles go through the QGIS network settings and cache.", "idea.c1.h": "Satellite imagery and terrain", "idea.c1.p": "The default base map is Esri World Imagery as an example. It can be switched to OpenStreetMap or to any XYZ Tiles connection from the QGIS browser. Mapzen Terrain Tiles with hill shading, vertical exaggeration is adjustable.", "idea.c2.h": "Precision from space to metres", "idea.c2.p": "Only offsets from the tile centre and from the eye reach the graphics card. At street level the on-screen position error of a point is below a thousandth of a pixel, and the picture does not jitter.", "layers.eyebrow": "The Layers panel", "layers.h2": "Borders, roads and names over the imagery", "layers.sub": "At the bottom left there are the groups Borders and names, Transport and Nature. The data come from OpenFreeMap vector tiles and follow the terrain. The same panel holds a coordinate grid with the equator and tropics, stars and NASA clouds of the last complete day. Check boxes take effect at once.", "layers.fig": "Eurasia from 9000 km. Names of countries and cities, country borders in yellow, region borders thin and white.", "layers.c1.h": "Upright labels", "layers.c1.p": "Labels stay upright at any turn and tilt and do not overlap. A place behind a mountain or beyond the horizon is not labelled. Zooming in brings smaller places, peaks, airports and road numbers.", "layers.c2.h": "Label language", "layers.c2.p": "By default the labels follow the QGIS language. In the view properties you can choose local names or one of 15 languages, among them English, Russian, German, Kazakh and Chinese.", "project.eyebrow": "Project layers", "project.h2": "The project map lies on the globe", "project.sub": "QGIS itself renders the vector and raster layers of the project with their styles and labels, and the globe lays the picture on the terrain in the map order. A check mark in the window list shows a layer on the globe and leaves the map unchanged. The Fly to menu item takes the camera to the layer extent.", "project.fig": "Perm from 40 km. Motorways, railways, road numbers and place names over satellite imagery.", "places.eyebrow": "Places, time, measurements", "places.h2": "Your places, their time and measurements", "places.sub": "Placemarks, paths and polygons are drawn with clicks on the globe and kept in My Places. A placemark can have an icon, a time and a view of its own. KML and KMZ files open and save. The Perm scene in Demo shows these features together.", "places.fig": "Perm demo. The time slider at 11:30-13:00 shows the Esplanade, the walk route and 3D buildings.", "places.c1.h": "Icons and time", "places.c1.p": "35 placemark icons take the placemark colour. A moment or interval puts the placemark on the time slider, placemarks outside the interval are hidden.", "places.c2.h": "Ruler and elevation profile", "places.c2.p": "Map and ground length, heading, area. The elevation profile of a path with ascent and slopes. Coordinates in degrees, UTM or MGRS.", "places.c3.h": "Tours", "places.c3.p": "A tour flies over placemarks or plays a recorded camera movement. The 🔁 button repeats a tour in a loop. A tour records to PNG frames for a video.", "nav.worlds": "Bodies and sky", "worlds.eyebrow": "Other bodies and the sky", "worlds.h2": "The Moon, Mars, other bodies and the starry sky", "worlds.sub": "The Body icon replaces the Earth with the Moon, Mars or one of 16 other bodies. Mars imagery is the Viking MDIM2.1 colour mosaic, about 650 m per pixel, Moon imagery is the LOLA albedo map with hill shading, about 670 m. Mars terrain is built from MOLA heights, Moon terrain from LOLA heights. Navigation, places, tours, the ruler and scenes work on any body, and a place keeps its body. The Sky item shows the celestial sphere from inside - 5080 stars, 88 constellations, the Sun, the Moon and the planets at the chosen moment.", "worlds.mars": "Mars. The Tharsis volcanoes and Valles Marineris, Viking mosaic.", "worlds.moon": "The near side of the Moon, LOLA albedo map with hill shading.", "worlds.sky": "The sky on 1 October 2026. Orion, Taurus and Gemini, the Moon at the Pleiades, Mars in Cancer.", "worlds.bodies": "Mercury, Venus, Jupiter, Io, Europa, Ganymede, Callisto, Mimas, Enceladus, Tethys, Dione, Rhea, Titan, Iapetus, Ceres and Vesta. The imagery comes from global NASA and USGS mosaics made from MESSENGER, Magellan, Galileo, Voyager, Cassini and Dawn data.", "worlds.c1.h": "Positions of the bodies", "worlds.c1.p": "Planet positions are computed from the JPL Keplerian orbital elements, the Moon position from the formulae of the Astronomical Almanac. In the years 1800-2050 the deviation from the JPL Horizons ephemerides is within 0.2° for planets and 0.3° for the Moon.", "worlds.c2.h": "Places and tours in the sky", "worlds.c2.p": "A sky place keeps the view direction and the field of view. A tour over sky places widens the field of view between distant points and narrows it at the target.", "worlds.c3.h": "Demo", "worlds.c3.p": "The icon with an academic cap opens prepared scenes. On the Earth these are Perm and Boca Chica, on Mars and the Moon the landing sites of spacecraft, in the sky constellations and bright objects.", "controls.eyebrow": "Controls", "controls.h2": "Mouse and keyboard navigation", "controls.sub": "The View properties icon opens the view properties, the About button lists the controls and the sources.", "g1": "Mouse and keyboard", "c1.h": "Grab the Earth", "c1.p": "The point under the cursor follows the mouse. After release the Earth keeps rotating by inertia.", "c2.h": "Zoom to the cursor", "c2.p": "The wheel zooms to the point under the cursor, and the point stays in place.", "c3.h": "Turn and tilt", "c3.p": "The middle button or Shift with the left button turns and tilts the view, the sky shows at the horizon.", "c4.h": "Search", "c4.p": "A place name or coordinates and Enter. The camera flies there smoothly, the place gets a red pin.", "c5.h": "Refresh", "c5.p": "A new base map and project layers appear after the Refresh button. Automatic refresh can be switched on.", "k1": "Left", "k2": "Wheel", "k3": "Middle", "k4": "Enter", "k5": "Button", "c6.h": "Clicks and keys", "c6.p": "A double click flies to the point, the right button zooms in and out, Ctrl looks around. Arrows, PageUp, PageDown, N, U and R control the view.", "c7.h": "On-screen controls", "c7.p": "The top right corner of the view holds the compass ring, the look and move sticks and the height slider. Away from the cursor they stay as a faint outline, near it in full.", "k6": "2×", "k7": "Corner", "fact1": "frames per second at least while the globe rotates, in every second of the measurement.", "fact2": "label languages and local names.", "fact3": "external dependencies. PyOpenGL ships with QGIS.", "fam.eyebrow": "The set of plugins", "fam.h2": "PlanetX in the Inform++ family", "fam.sub": "Isoliner builds contours, Topoliner puts them in order, Isoliner3D shows geology in three dimensions, PlanetX shows the whole Earth. All plugins work independently.", "fam.c1.p": "Kriging, isolines, relief and catchments, sections with drawings, a geological bed model.", "fam.c2.p": "Topology cleaning of contours and polygons, thinning that preserves topology.", "fam.c3.p": "Bed bodies, boreholes and sections in three dimensions, a map draped on the relief, a block model.", "fam.a": "Open in the QGIS catalogue", "ftr.line1": "GNU GPL v3 · QGIS 3.36 and newer, QGIS 4", "ftr.line2": "Developed by Inform++ LLC", "ftr.line3": "Imagery Esri, Vantor, Earthstar Geographics, and the GIS User Community. Map data © OpenStreetMap contributors, vector tiles OpenFreeMap. Terrain Mapzen Terrain Tiles. Mars - NASA, USGS, Viking MDIM2.1, the Moon - USGS, LRO LOLA, tiles OpenPlanetaryMap. Mars heights - NASA MGS MOLA MEGDR, Moon heights - NASA LRO LOLA GDR. Constellations and star names - d3-celestial, © Olaf Frohn."}};

function apply(lang){
  var d = TEXTS[lang] || TEXTS.ru;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n')];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll('[data-i18n-attr]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-attr')];
    if (value !== undefined) el.setAttribute('content', value);
  });
  document.querySelectorAll('[data-i18n-href]').forEach(function(el){
    var value = d[el.getAttribute('data-i18n-href')];
    if (value !== undefined) el.setAttribute('href', value);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang') === lang);
  });
  try { localStorage.setItem('planetx-lang', lang); } catch (e) {}
}

// Меню прокручивает кодом, а не якорем. Внутри CMS ссылка вида
// «#idea» может вести на другую страницу.
document.querySelectorAll('.nav a[href^="#"]').forEach(function(a){
  a.addEventListener('click', function(ev){
    var el = document.getElementById(a.getAttribute('href').slice(1));
    if (!el) return;
    ev.preventDefault();
    el.scrollIntoView({behavior: 'smooth', block: 'start'});
  });
});

document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){
    apply(b.getAttribute('data-lang'));
  });
});

// По умолчанию русский: страница живёт на русском сайте.
var saved = null;
try { saved = localStorage.getItem('planetx-lang'); } catch (e) {}
apply(saved || 'ru');

// Тексты подставляются после разбора страницы, переход по адресу
// с решёткой доводится до места вручную.
(function () {
  var id = (location.hash || '').slice(1);
  if (!id) return;
  var go = function () {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({block: 'start'});
  };
  go();
  setTimeout(go, 0);
  window.addEventListener('load', go);
})();
</script>
